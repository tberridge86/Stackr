<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stackr · iPhone 15 Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#08090c; color:#f6f7fa; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100vh; background:radial-gradient(circle at 50% -15%, #28364d 0, #111722 38%, #08090c 72%); }
    .app { min-height:100vh; display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; align-items:center; gap:12px; padding:14px clamp(16px, 3vw, 32px); border-bottom:1px solid rgba(255,255,255,.08); background:rgba(10,12,17,.78); backdrop-filter:blur(22px); z-index:2; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; white-space:nowrap; letter-spacing:-.02em; }
    .brand-mark { width:28px; height:28px; border-radius:9px; background:linear-gradient(145deg,#7d9fff,#7354e7); box-shadow:0 7px 18px #6953db66; }
    .controls { display:flex; align-items:center; gap:8px; width:min(100%, 890px); margin-left:auto; }
    input, button { font:inherit; color:inherit; border:1px solid rgba(255,255,255,.12); background:#171b24; border-radius:10px; height:38px; }
    input { min-width:0; padding:0 11px; outline:none; } input:focus { border-color:#8fa7ff; box-shadow:0 0 0 3px #7192ff22; }
    #app-url { flex:1 1 290px; } #route { flex:0 1 160px; }
    button { display:grid; place-items:center; min-width:38px; padding:0 12px; cursor:pointer; transition:.16s ease; } button:hover { background:#252b38; border-color:#ffffff33; } button:active { transform:scale(.97); }
    #go { background:#6989ff; border-color:#87a1ff; color:#fff; font-weight:700; }
    .icon { font-size:18px; line-height:1; padding:0; }
    .active { color:#aebeff; border-color:#718fff; background:#27345a; }
    .workspace { min-height:0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; justify-items:center; gap:20px; padding:24px; overflow:hidden; }
    .meta { width:min(270px, 100%); color:#a7afc0; font-size:13px; line-height:1.5; }
    .meta:last-child { text-align:right; }
    .eyebrow { text-transform:uppercase; color:#7f8ba3; font-size:10px; font-weight:800; letter-spacing:.13em; }
    .dimension { margin-top:3px; font-size:20px; color:#eff2fa; font-weight:700; letter-spacing:-.04em; }
    .status { display:inline-flex; align-items:center; gap:7px; margin-top:12px; padding:6px 9px; border-radius:99px; background:#10151e; }
    .dot { width:7px; height:7px; border-radius:50%; background:#f4b954; box-shadow:0 0 0 3px #f4b95422; } .status.live .dot { background:#58dc9a; box-shadow:0 0 0 3px #58dc9a22; }
    .stage { --scale: .7; --outer-w:417px; --outer-h:876px; width:calc(var(--outer-w) * var(--scale)); height:calc(var(--outer-h) * var(--scale)); position:relative; }
    .phone { --screen-w:393px; --screen-h:852px; --outer-w:417px; --outer-h:876px; position:absolute; width:var(--outer-w); height:var(--outer-h); transform:scale(var(--scale)); transform-origin:top left; padding:12px; border-radius:59px; background:linear-gradient(135deg,#5d636a 0%,#16181e 11%,#020304 48%,#383d45 100%); box-shadow:0 38px 90px #000b, inset 0 0 0 1px #ffffff55, inset 0 0 0 3px #050609; }
    .screen { overflow:hidden; position:relative; width:var(--screen-w); height:var(--screen-h); border-radius:48px; background:#0b0c0f; box-shadow:inset 0 0 0 1px #ffffff22; }
    iframe { display:block; width:var(--screen-w); height:var(--screen-h); border:0; background:#fff; }
    .island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:126px; height:37px; border-radius:22px; background:#030304; box-shadow:0 1px 2px #000; pointer-events:none; z-index:2; }
    .home-indicator { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:999px; background:rgba(255,255,255,.92); pointer-events:none; z-index:2; }
    .safe-guide { display:none; position:absolute; inset:0; pointer-events:none; z-index:1; border:1px dashed #72bbff; background:linear-gradient(#72bbff18 59px, transparent 59px calc(100% - 34px), #72bbff18 calc(100% - 34px)); }
    .safe-guide::after { content:"SAFE AREA"; position:absolute; top:62px; left:9px; padding:2px 5px; color:#c5e5ff; background:#24588b99; font:700 8px/1 system-ui; letter-spacing:.07em; border-radius:3px; }
    .landscape .stage { --outer-w:876px; --outer-h:417px; }.landscape .phone { --screen-w:852px; --screen-h:393px; --outer-w:876px; --outer-h:417px; border-radius:42px; }
    .landscape .screen { border-radius:31px; }.landscape .island { top:50%; left:11px; transform:translateY(-50%); width:37px; height:126px; }.landscape .home-indicator { bottom:auto; left:auto; right:9px; top:50%; transform:translateY(-50%) rotate(90deg); }.landscape .safe-guide { background:linear-gradient(90deg,#72bbff18 59px,transparent 59px calc(100% - 34px),#72bbff18 calc(100% - 34px)); }.landscape .safe-guide::after { top:9px; left:62px; }
    .with-guide .safe-guide { display:block; }
    @media (max-width:850px) { .workspace { grid-template-columns:1fr; grid-template-rows:auto auto auto; padding:18px; gap:12px; } .meta { width:auto; text-align:center!important; } .meta:last-child { order:3; } .toolbar { flex-wrap:wrap; } .controls { width:100%; margin-left:0; } }
    @media (max-width:560px) { .toolbar { gap:9px; } .brand { width:100%; } #app-url { flex-basis:100%; } #route { flex:1; } .workspace { padding-inline:8px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="brand"><span class="brand-mark"></span>Stackr Preview</div>
      <form class="controls" id="navigation">
        <input id="app-url" aria-label="Expo web URL" value="__IPHONE_PREVIEW_APP_URL__" spellcheck="false">
        <input id="route" aria-label="App route" value="/" placeholder="/route" spellcheck="false">
        <button id="go" type="submit">Go</button>
        <button class="icon" id="reload" type="button" aria-label="Reload app" title="Reload app">↻</button>
        <button class="icon" id="orientation" type="button" aria-label="Switch to landscape" title="Rotate preview">↔</button>
        <button class="icon" id="guides" type="button" aria-pressed="false" aria-label="Toggle safe area guides" title="Safe area guides">⌑</button>
      </form>
    </header>
    <section class="workspace" id="workspace">
      <aside class="meta"><div class="eyebrow">Layout device</div><div class="dimension">iPhone 15</div><div>Exact 393 × 852 layout viewport. Expo Web preview; native iOS APIs require a device or Mac simulator.</div></aside>
      <div class="stage" id="stage"><div class="phone" id="phone"><div class="screen"><iframe id="preview" name="stackr-iphone-15-preview" title="Live app preview" allow="clipboard-read; clipboard-write"></iframe><div class="safe-guide"></div><div class="island"></div><div class="home-indicator"></div></div></div></div>
      <aside class="meta"><div class="eyebrow">Viewport</div><div class="dimension" id="dimensions">393 × 852</div><div class="eyebrow" style="margin-top:14px">Account environment</div><div class="dimension" id="preview-environment" style="font-size:16px;letter-spacing:-.02em">__IPHONE_PREVIEW_ENVIRONMENT__</div><div class="eyebrow" style="margin-top:14px">App source</div><div id="preview-source">__IPHONE_PREVIEW_SOURCE__</div><div class="status" id="status"><span class="dot"></span><span>Connecting…</span></div></aside>
    </section>
  </main>
  <script>
    const el = (id) => document.getElementById(id);
    const phone = el('phone'), workspace = el('workspace'), frame = el('preview'), route = el('route'), appUrl = el('app-url'), status = el('status'), dimensions = el('dimensions'), previewEnvironment = el('preview-environment'), previewSource = el('preview-source');
    const verifiedEnvironment = '__IPHONE_PREVIEW_VERIFIED_ENVIRONMENT__';
    const verifiedSource = '__IPHONE_PREVIEW_VERIFIED_SOURCE__';
    let landscape = false, frameLoaded = false, frameStarted = false, statusTimer;
    const localHosts = ['localhost', '127.0.0.1', '[::1]', '::1'];
    function localBase() {
      try {
        const base = new URL(appUrl.value.trim());
        if (!['http:', 'https:'].includes(base.protocol) || !localHosts.includes(base.hostname) || base.username || base.password) return null;
        return base;
      } catch { return null; }
    }
    function source() {
      try { const base = localBase(); if (!base) return ''; const target = new URL(route.value.trim() || '/', `${base.origin}/`); return target.origin === base.origin ? target.href : ''; }
      catch { return ''; }
    }
    function updateAttribution(verified) {
      if (verified) {
        previewEnvironment.textContent = verifiedEnvironment;
        previewSource.textContent = verifiedSource;
      } else {
        previewEnvironment.textContent = 'External Expo · config unverified';
        previewSource.textContent = 'External localhost Expo · source unverified';
      }
    }
    function restoreLocation() {
      const params = new URLSearchParams(window.location.search);
      const requestedAppUrl = params.get('appUrl');
      if (requestedAppUrl !== null) {
        const previousAppUrl = appUrl.value;
        appUrl.value = requestedAppUrl;
        if (!localBase()) appUrl.value = previousAppUrl;
      }
      const requestedRoute = params.get('route');
      if (requestedRoute !== null) {
        const previousRoute = route.value;
        route.value = requestedRoute;
        if (!source()) route.value = previousRoute;
      }
    }
    function persistLocation() {
      const params = new URLSearchParams(window.location.search);
      params.set('appUrl', appUrl.value.trim());
      const currentRoute = route.value.trim();
      if (currentRoute && currentRoute !== '/') params.set('route', currentRoute); else params.delete('route');
      const query = params.toString();
      history.replaceState(null, '', `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash}`);
    }
    function setStatus(live, message) { status.classList.toggle('live', live); status.lastElementChild.textContent = message; }
    async function checkStatus() {
      const url = source();
      if (!url) return setStatus(false, 'Enter a valid app URL');
      try {
        const response = await fetch(`/api/status?appUrl=${encodeURIComponent(url)}`, { cache: 'no-store' });
        const result = await response.json();
        if (url !== source()) return;
        if (response.ok && !frameStarted) {
          frameStarted = true;
          frame.src = url;
        }
        updateAttribution(result.verified === true);
        setStatus(response.ok && frameLoaded, response.ok && !frameLoaded ? 'Expo ready · loading app…' : result.message);
      } catch { if (url !== source()) return; updateAttribution(false); setStatus(false, 'Waiting for Expo…'); }
    }
    function load() { updateAttribution(false); const url = source(); if (!url) return setStatus(false, 'Enter a valid app URL'); frameLoaded = false; frameStarted = false; setStatus(false, 'Connecting…'); checkStatus(); }
    function fit() { const naturalWidth = landscape ? 876 : 417; const naturalHeight = landscape ? 417 : 876; const availableWidth = Math.max(280, workspace.clientWidth - 64); const availableHeight = Math.max(280, workspace.clientHeight - 40); const scale = Math.min(availableWidth / naturalWidth, availableHeight / naturalHeight, 1); el('stage').style.setProperty('--scale', scale.toFixed(4)); }
    el('navigation').addEventListener('submit', (event) => { event.preventDefault(); persistLocation(); load(); });
    el('reload').addEventListener('click', () => { setStatus(false, 'Reloading…'); try { frame.contentWindow.location.reload(); } catch { load(); } });
    el('orientation').addEventListener('click', () => { landscape = !landscape; document.body.classList.toggle('landscape', landscape); el('orientation').setAttribute('aria-label', landscape ? 'Switch to portrait' : 'Switch to landscape'); dimensions.textContent = landscape ? '852 × 393' : '393 × 852'; fit(); load(); });
    el('guides').addEventListener('click', (event) => { const active = document.body.classList.toggle('with-guide'); event.currentTarget.classList.toggle('active', active); event.currentTarget.setAttribute('aria-pressed', active); });
    frame.addEventListener('load', () => { if (!frameStarted) return; frameLoaded = true; checkStatus(); });
    frame.addEventListener('error', () => { frameLoaded = false; updateAttribution(false); setStatus(false, 'Could not reach app'); });
    restoreLocation(); new ResizeObserver(fit).observe(workspace); window.addEventListener('resize', fit); fit(); load(); statusTimer = setInterval(checkStatus, 2000); window.addEventListener('beforeunload', () => clearInterval(statusTimer));
  </script>
</body>
</html>
