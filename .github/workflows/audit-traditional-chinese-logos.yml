name: Audit Traditional Chinese logo sources

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-v2-20260912
    paths:
      - .github/scripts/audit_traditional_chinese_logos.py
      - .github/workflows/audit-traditional-chinese-logos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python .github/scripts/audit_traditional_chinese_logos.py
      - uses: actions/upload-artifact@v4
        with:
          name: traditional-chinese-logo-audit
          path: build/tw-logo-audit/
          if-no-files-found: error
          retention-days: 3
