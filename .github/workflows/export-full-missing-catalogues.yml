name: Export Full Missing Catalogues

on:
  push:
    branches:
      - automation/catalogue-gap-export-20260818
    paths:
      - .github/workflows/export-full-missing-catalogues.yml
      - scripts/catalogue-master.ts
      - scripts/catalogue-ingestion/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-full-missing-catalogues.yml
      - scripts/catalogue-master.ts
      - scripts/catalogue-ingestion/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackr-full-missing-catalogue-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      SUPABASE_URL: https://lmwfhvexfcoyeuoyrlco.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      STACKR_CATALOGUE_IMPORT_TARGET: staging
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out StackR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the canonical five-language gap reports
        run: >-
          npx tsx scripts/catalogue-master.ts report
          --target=staging
          --language=en,ja,zh-tw,zh-cn,ko
          --reportDir=reports/catalogue

      - name: Add export manifest
        shell: bash
        run: |
          cat > reports/catalogue/EXPORT-MANIFEST.txt <<'EOF'
          StackR full missing catalogue export
          Source of truth: canonical StackR staging catalogue
          Languages: English, Japanese, Traditional Chinese, Simplified Chinese, Korean
          Generated by: scripts/catalogue-master.ts report
          Production modified: no
          EOF
          printf 'Commit: %s\nGenerated UTC: %s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> reports/catalogue/EXPORT-MANIFEST.txt
          find reports/catalogue -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload full catalogue reports
        uses: actions/upload-artifact@v4
        with:
          name: stackr-full-missing-catalogues
          path: reports/catalogue/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
