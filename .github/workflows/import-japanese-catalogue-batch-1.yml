name: Import Japanese Catalogue Batch 1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN JAPANESE BATCH 1 TO STAGING
        required: true
        type: string
  push:
    branches:
      - backend/release-hardening-2026-08-19
    paths:
      - '.github/workflows/import-japanese-catalogue-batch-1.yml'
      - 'scripts/collect-official-japanese-set-metadata.py'
      - 'scripts/import-official-japanese-set-metadata.mjs'
      - 'scripts/reconcile-official-japanese-set-import.mjs'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  import-set:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'RUN JAPANESE BATCH 1 TO STAGING')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - set_code: CP4
            release_date: '2016-04-16'
            english_name: 'Premium Champion Pack EX × M × BREAK'
          - set_code: PCG10
            release_date: '2007-07-05'
            english_name: 'World Champions Pack'
          - set_code: S2
            release_date: '2020-03-06'
            english_name: 'Rebellion Crash'
          - set_code: S3
            release_date: '2020-06-05'
            english_name: 'Infinity Zone'
          - set_code: S4
            release_date: '2020-09-18'
            english_name: 'Amazing Volt Tackle'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    concurrency:
      group: stackr-japanese-batch-1-${{ matrix.set_code }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_URL: https://lmwfhvexfcoyeuoyrlco.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      STACKR_CATALOGUE_IMPORT_TARGET: staging
      STACKR_JP_SET_CODE: ${{ matrix.set_code }}
      STACKR_JP_RELEASE_DATE: ${{ matrix.release_date }}
      STACKR_JP_ENGLISH_NAME: ${{ matrix.english_name }}
      STACKR_REPORT_DIR: reports/catalogue/japanese-batch-1/${{ matrix.set_code }}

    steps:
      - name: Announce set collection and staging import
        run: >-
          gh api repos/${{ github.repository }}/issues/48/comments
          --method POST
          --field body="Japanese batch 1 run **${GITHUB_RUN_ID}** started for \`${STACKR_JP_SET_CODE}\`. It will collect the complete official checklist, import it to the hard-pinned staging project, reconcile concept links and leave production untouched."

      - name: Check out reviewed batch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: backend/release-hardening-2026-08-19
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate staging target and inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STACKR_JP_SET_CODE" =~ ^[A-Za-z0-9+._:-]+$ ]]
          [[ "$STACKR_JP_RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test -n "$STACKR_JP_ENGLISH_NAME"
          test "$SUPABASE_URL" = 'https://lmwfhvexfcoyeuoyrlco.supabase.co'
          test -n "$SUPABASE_SECRET_KEY"
          case "$SUPABASE_URL" in
            *oakdbbzdqwurpjnoqhmu*) echo 'Production target detected; refusing batch import.'; exit 1 ;;
          esac
          mkdir -p "$STACKR_REPORT_DIR"

      - name: Install pinned dependencies
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check --no-input beautifulsoup4==4.13.4

      - name: Syntax-check collection and import programs
        run: |
          python3 -m py_compile scripts/collect-official-japanese-set-metadata.py
          node --check scripts/import-official-japanese-set-metadata.mjs
          node --check scripts/reconcile-official-japanese-set-import.mjs

      - name: Collect complete official Japanese checklist
        run: >-
          python3 scripts/collect-official-japanese-set-metadata.py
          --set-code="$STACKR_JP_SET_CODE"
          --output="$STACKR_REPORT_DIR/catalogue.json"
          --max-results=600
          --minimum-delay-ms=650

      - name: Validate immutable collector evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg set "$STACKR_JP_SET_CODE" '
            .source == "pokemon_card_jp_official"
            and .set_code_requested == $set
            and .official_set_codes == [$set]
            and .read_only == true
            and .images_downloaded == false
            and (.parser_errors | length) == 0
            and (.identity_conflicts | length) == 0
            and .api_card_ids_collected > 0
            and .unique_printings > 0
            and .duplicate_official_variants == 0
          ' "$STACKR_REPORT_DIR/catalogue.json"

      - name: Import verified printings to staging
        run: >-
          node scripts/import-official-japanese-set-metadata.mjs
          --input="$STACKR_REPORT_DIR/catalogue.json"
          --set-code="$STACKR_JP_SET_CODE"
          --release-date="$STACKR_JP_RELEASE_DATE"
          --english-name="$STACKR_JP_ENGLISH_NAME"
          --target=staging
          --apply
          --report="$STACKR_REPORT_DIR/import-report.json"

      - name: Reconcile canonical concept links
        run: >-
          node scripts/reconcile-official-japanese-set-import.mjs
          --set-code="$STACKR_JP_SET_CODE"
          --target=staging
          --apply
          --report="$STACKR_REPORT_DIR/reconciliation-report.json"

      - name: Create per-set completion report
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dir = process.env.STACKR_REPORT_DIR;
          const read = (name) => {
            const file = `${dir}/${name}`;
            return fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : null;
          };
          const catalogue = read('catalogue.json');
          const imported = read('import-report.json');
          const reconciled = read('reconciliation-report.json');
          const ok = Boolean(catalogue && imported?.ok && reconciled?.ok);
          const lines = [
            `### Japanese batch 1 — ${process.env.STACKR_JP_SET_CODE}`,
            '',
            `Workflow run: **${process.env.GITHUB_RUN_ID}** — result evidence: **${ok ? 'PASS' : 'INCOMPLETE/FAILED'}**.`,
            '',
            '| Measure | Result |',
            '|---|---:|',
            `| Official card IDs | ${catalogue?.api_card_ids_collected ?? '—'} |`,
            `| Unique printings | ${catalogue?.unique_printings ?? '—'} |`,
            `| Printed denominator(s) | ${catalogue?.denominators?.join(', ') ?? '—'} |`,
            `| Parser errors | ${catalogue?.parser_errors?.length ?? '—'} |`,
            `| Identity conflicts | ${catalogue?.identity_conflicts?.length ?? '—'} |`,
            `| Imported printings | ${imported?.verification?.active_printings ?? '—'} |`,
            `| Concept links applied after import | ${reconciled?.writes?.concept_links_applied ?? '—'} |`,
            `| Unresolved concepts | ${reconciled?.final?.unresolved_concepts ?? '—'} |`,
            `| Missing English card names | ${reconciled?.final?.missing_english_names ?? '—'} |`,
            `| Missing rarity | ${reconciled?.final?.missing_rarity ?? '—'} |`,
            `| Missing artist | ${reconciled?.final?.missing_artist ?? '—'} |`,
            `| Production modified | false |`,
            '',
            'This batch closes card-list identity first. Image mirroring, exact finish/variant classification, English card-name enrichment and rarity are tracked as the next enrichment lane.',
          ];
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(`${dir}/summary.md`, `${lines.join('\n')}\n`);
          NODE

      - name: Upload immutable per-set evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackr-japanese-batch-1-${{ matrix.set_code }}-${{ github.run_id }}
          path: ${{ env.STACKR_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Report set outcome to PR 48
        if: always()
        shell: bash
        run: |
          body="$(cat "$STACKR_REPORT_DIR/summary.md")"
          gh api repos/${{ github.repository }}/issues/48/comments \
            --method POST \
            --field body="$body"
