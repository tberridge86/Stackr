name: Sync Official English Set Logos with Main

on:
  push:
    branches:
      - agent/catalogue/official-english-set-logos
    paths:
      - .github/workflows/sync-official-english-set-logos-with-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out specialist branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Merge current main
        shell: bash
        run: |
          git config user.name "Stackr catalogue agent"
          git config user.email "tberridge86@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify reconciled runtime
        run: |
          npm run test:official-english-set-logos
          node --import ./scripts/enable-node-tooling-runtime.mjs --import tsx scripts/test-japanese-set-logo-runtime-lookup.ts
          npm run typecheck
          git diff --check origin/main...HEAD

      - name: Push verified reconciliation
        run: git push origin HEAD:agent/catalogue/official-english-set-logos
