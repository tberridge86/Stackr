name: Inspect Traditional Chinese expansion-page assets

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-a4-v2
    paths:
      - .github/scripts/inspect_tc_special_pages.py
      - .github/workflows/inspect-tc-special-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - run: python .github/scripts/inspect_tc_special_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: tc-special-page-inspection
          path: build/tc-special-page-inspection/
          if-no-files-found: error
          retention-days: 3
