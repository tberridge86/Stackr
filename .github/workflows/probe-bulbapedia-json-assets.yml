name: Probe exact Bulbagarden logo URLs

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-a4-v2
    paths:
      - .github/scripts/probe_bulbapedia_json_assets.py
      - .github/workflows/probe-bulbapedia-json-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python .github/scripts/probe_bulbapedia_json_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: bulbapedia-json-assets-probe
          path: build/bulbapedia-json-probe/
          if-no-files-found: warn
          retention-days: 3
