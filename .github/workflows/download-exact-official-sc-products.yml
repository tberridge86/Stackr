name: Download exact official Simplified Chinese products

on:
  push:
    branches:
      - artifacts/sc-set-image-retry-20260911
    paths:
      - artifact-jobs/simplified-chinese-set-logos/download_exact_official_products.py
      - .github/workflows/download-exact-official-sc-products.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow beautifulsoup4
      - name: Retrieve exact product-specification images
        working-directory: artifact-jobs/simplified-chinese-set-logos
        run: python download_exact_official_products.py
      - uses: actions/upload-artifact@v4
        with:
          name: exact-official-simplified-chinese-products
          path: artifact-jobs/simplified-chinese-set-logos/exact-official-products/
          if-no-files-found: error
          retention-days: 14
          compression-level: 8
