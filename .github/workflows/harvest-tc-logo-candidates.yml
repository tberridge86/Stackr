name: Harvest Traditional Chinese Logo Candidates

on:
  push:
    branches:
      - asset/pokemon-tc-set-logo-sheet-20260911
    paths:
      - tools/harvest_tc_logo_candidates.py
      - .github/workflows/harvest-tc-logo-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pillow beautifulsoup4
      - run: python tools/harvest_tc_logo_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: tc-logo-candidate-harvest-${{ github.run_id }}
          path: artifacts/tc-logo-candidate-harvest/
          if-no-files-found: error
          retention-days: 7
