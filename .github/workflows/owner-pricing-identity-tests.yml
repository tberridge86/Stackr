name: Owner Pricing Identity Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: owner-pricing-identities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-pricing-identity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install locked backend dependencies
        run: npm ci --prefix backend
      # All suites use fixtures/mocks. No production environment, service
      # credentials, provider calls, refresh job or deployment is configured.
      - name: Existing owner worker regression
        run: npm run test:owner-provider-price-refresh
      - name: Printing identity and rejection regressions
        run: node --test scripts/test-owner-price-printing-identities.mjs
      - name: Language-scoped saved reference regressions
        run: node --test scripts/test-owner-price-saved-references.mjs
      - name: Actual worker scoped-identity integration
        run: node --test scripts/test-owner-price-scoped-worker.mjs

      - name: Catalogue cycle and stable collection regressions
        run: npm run test:catalogue-pricing
