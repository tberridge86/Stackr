name: Stackr Ingestion Workers

on:
  workflow_dispatch:
    inputs:
      command:
        description: Approved ingestion command
        required: true
        default: quality-report
        type: choice
        options: [quality-report, ingest-source, ingest-language, ingest-set, resume-import, rebuild-record, repair-en-ja-assets]
      source:
        description: Source code for ingest-source
        required: false
        type: string
      language:
        description: Language code for ingest-language
        required: false
        type: string
      set:
        description: Set ID for ingest-set
        required: false
        type: string
      id:
        description: Resume run key or provider record ID
        required: false
        type: string
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: stackr-catalogue-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.command != 'repair-en-ja-assets') ||
      (github.event_name == 'schedule' &&
      vars.STACKR_CATALOGUE_INGESTION_SCHEDULED == 'true' &&
      vars.STACKR_CATALOGUE_INGESTION_AUTOMATION_APPROVED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ingestion
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STACKR_CATALOGUE_IMPORT_TARGET: staging
      STACKR_INGEST_SOURCE: ${{ inputs.source }}
      STACKR_INGEST_LANGUAGE: ${{ inputs.language }}
      STACKR_INGEST_SET: ${{ inputs.set }}
      STACKR_INGEST_ID: ${{ inputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run terms-safe scheduled quality report
        if: github.event_name == 'schedule'
        run: npm run catalogue:quality-report

      - name: Run manual quality report
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'quality-report'
        run: npm run catalogue:quality-report

      - name: Run one source
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'ingest-source'
        run: >-
          npm run catalogue:ingest -- run-source
          --source="$STACKR_INGEST_SOURCE"
          --target=staging

      - name: Run one language
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'ingest-language'
        run: >-
          npm run catalogue:ingest -- run-language
          --source="$STACKR_INGEST_SOURCE"
          --language="$STACKR_INGEST_LANGUAGE"
          --target=staging

      - name: Run one set
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'ingest-set'
        run: >-
          npm run catalogue:ingest -- run-set
          --source="$STACKR_INGEST_SOURCE"
          --setId="$STACKR_INGEST_SET"
          --target=staging

      - name: Resume interrupted import
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'resume-import'
        run: >-
          npm run catalogue:ingest -- resume-import
          --source="$STACKR_INGEST_SOURCE"
          --runKey="$STACKR_INGEST_ID"
          --target=staging

      - name: Rebuild canonical record
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'rebuild-record'
        run: >-
          npm run catalogue:ingest -- rebuild-record
          --source="$STACKR_INGEST_SOURCE"
          --providerRecordId="$STACKR_INGEST_ID"
          --target=staging

  repair-en-ja-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'repair-en-ja-assets'
    name: Repair ${{ matrix.language_name }} assets batch ${{ matrix.batch }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - language: en
            language_name: English
            batch: 1
            offset: 0
          - language: en
            language_name: English
            batch: 2
            offset: 5000
          - language: en
            language_name: English
            batch: 3
            offset: 10000
          - language: en
            language_name: English
            batch: 4
            offset: 15000
          - language: ja
            language_name: Japanese
            batch: 1
            offset: 0
          - language: ja
            language_name: Japanese
            batch: 2
            offset: 5000
          - language: ja
            language_name: Japanese
            batch: 3
            offset: 10000
          - language: ja
            language_name: Japanese
            batch: 4
            offset: 15000
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ingestion
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STACKR_CATALOGUE_IMPORT_TARGET: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate controlled repair worker
        run: npx --no-install tsx scripts/repair-tcgdex-language-assets.ts --help

      - name: Repair ${{ matrix.language_name }} card fronts, logos and symbols
        id: repair
        run: >-
          npx --no-install tsx scripts/repair-tcgdex-language-assets.ts
          --language=${{ matrix.language }}
          --offset=${{ matrix.offset }}
          --limit=5000
          --runKey=github-${{ github.run_id }}-${{ matrix.language }}-${{ matrix.batch }}
          --requestId=github-actions:${{ github.run_id }}:${{ matrix.language }}:${{ matrix.batch }}
          --writeConcurrency=8

      - name: Verify ${{ matrix.language_name }} catalogue quality
        if: always()
        run: npm run catalogue:quality-report -- --language=${{ matrix.language }}
