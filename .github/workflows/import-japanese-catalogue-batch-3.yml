name: Import Japanese Catalogue Batch 3

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN JAPANESE BATCH 3 TO STAGING
        required: true
        type: string
  push:
    branches:
      - backend/release-hardening-2026-08-19
    paths:
      - '.github/workflows/import-japanese-catalogue-batch-3.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  import-set:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'RUN JAPANESE BATCH 3 TO STAGING')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - canonical_set_code: XY2
            official_set_code: XY2
            release_date: '2014-03-15'
            english_name: 'Wild Blaze'
          - canonical_set_code: XY9
            official_set_code: XY9
            release_date: '2015-12-11'
            english_name: 'Rage of the Broken Heavens'
          - canonical_set_code: XY10
            official_set_code: XY10
            release_date: '2016-03-18'
            english_name: 'Awakening Psychic King'
          - canonical_set_code: XY6
            official_set_code: XY6
            release_date: '2015-03-14'
            english_name: 'Emerald Break'
          - canonical_set_code: S3a
            official_set_code: S3a
            release_date: '2020-07-10'
            english_name: 'Legendary Heartbeat'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    concurrency:
      group: stackr-japanese-batch-3-${{ matrix.canonical_set_code }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_URL: https://lmwfhvexfcoyeuoyrlco.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      STACKR_CATALOGUE_IMPORT_TARGET: staging
      CANONICAL_SET_CODE: ${{ matrix.canonical_set_code }}
      OFFICIAL_SET_CODE: ${{ matrix.official_set_code }}
      RELEASE_DATE: ${{ matrix.release_date }}
      ENGLISH_NAME: ${{ matrix.english_name }}
      STACKR_REPORT_DIR: reports/catalogue/japanese-batch-3/${{ matrix.canonical_set_code }}

    steps:
      - name: Announce guarded set completion
        run: >-
          gh api repos/${{ github.repository }}/issues/48/comments
          --method POST
          --field body="Japanese batch 3 run **${GITHUB_RUN_ID}** started for \`${CANONICAL_SET_CODE}\`. It will reject partial official partitions unless collector numbers are continuous from 001 to the final result, then import identities, variants and exact images to staging only."

      - name: Check out reviewed catalogue automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: backend/release-hardening-2026-08-19
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate hard-pinned staging target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANONICAL_SET_CODE" =~ ^[A-Za-z0-9+._:-]+$ ]]
          [[ "$OFFICIAL_SET_CODE" =~ ^[A-Za-z0-9+._:-]+$ ]]
          [[ "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test -n "$ENGLISH_NAME"
          test "$SUPABASE_URL" = 'https://lmwfhvexfcoyeuoyrlco.supabase.co'
          test -n "$SUPABASE_SECRET_KEY"
          case "$SUPABASE_URL" in
            *oakdbbzdqwurpjnoqhmu*) echo 'Production target detected; refusing batch 3 import.'; exit 1 ;;
          esac
          mkdir -p "$STACKR_REPORT_DIR"

      - name: Install pinned dependencies
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check --no-input beautifulsoup4==4.13.4

      - name: Syntax-check collector, importer and image worker
        run: |
          python3 -m py_compile scripts/collect-official-japanese-set-metadata-v2.py
          node --check scripts/import-complete-official-japanese-set.mjs
          node --check scripts/mirror-official-japanese-card-images.mjs

      - name: Collect complete official Japanese result
        shell: bash
        run: |
          set +e
          python3 scripts/collect-official-japanese-set-metadata-v2.py \
            --set-code="$OFFICIAL_SET_CODE" \
            --output="$STACKR_REPORT_DIR/source-catalogue.json" \
            --max-results=1000 \
            --minimum-delay-ms=650
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          test -s "$STACKR_REPORT_DIR/source-catalogue.json"

      - name: Reject partial, split or ambiguous official partitions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ['STACKR_REPORT_DIR']) / 'source-catalogue.json').read_text(encoding='utf-8'))
          assert report['source'] == 'pokemon_card_jp_official'
          assert report['collector_version'] == 2
          assert report['set_code_requested'] == os.environ['OFFICIAL_SET_CODE']
          assert report['official_set_codes'] == [os.environ['OFFICIAL_SET_CODE']]
          assert report['read_only'] is True
          assert report['images_downloaded'] is False
          assert report['api_card_ids_collected'] > 0
          assert report['detail_rows_collected'] == report['api_card_ids_collected']
          assert report['unique_printings'] == report['api_card_ids_collected']
          assert report['duplicate_official_variants'] == 0
          assert report['unnumbered_detail_rows'] == 0
          assert report['unresolved_unnumbered_variants'] == []
          assert report['parser_errors'] == []
          assert report['identity_conflicts'] == []
          assert all(len(card['official_card_ids']) == 1 for card in report['printings'])
          numbers = sorted(int(card['collector_number']) for card in report['printings'])
          assert numbers[0] == 1, numbers[:10]
          assert numbers == list(range(1, numbers[-1] + 1)), {
              'missing': sorted(set(range(1, numbers[-1] + 1)) - set(numbers)),
              'first': numbers[0],
              'last': numbers[-1],
              'count': len(numbers),
          }
          denominator_values = {int(value) for value in report['denominators']}
          assert len(denominator_values) == 1
          assert numbers[-1] >= next(iter(denominator_values))
          PY

      - name: Import the complete canonical set
        run: >-
          node scripts/import-complete-official-japanese-set.mjs
          --input="$STACKR_REPORT_DIR/source-catalogue.json"
          --canonical-set-code="$CANONICAL_SET_CODE"
          --official-set-code="$OFFICIAL_SET_CODE"
          --release-date="$RELEASE_DATE"
          --english-name="$ENGLISH_NAME"
          --target=staging
          --apply
          --report="$STACKR_REPORT_DIR/import-report.json"

      - name: Verify zero structural identity gaps
        run: |
          jq -e '
            .ok == true
            and .production_modified == false
            and .full_total > 0
            and .verification.active_printings == .full_total
            and .verification.distinct_collector_numbers == .full_total
            and .verification.printings_with_variant == .full_total
            and .verification.official_ids_expected == .full_total
            and .verification.official_ids_verified == .full_total
            and .verification.unresolved_concepts == 0
            and (.verification.duplicate_collector_numbers | length) == 0
            and (.verification.duplicate_variant_keys | length) == 0
            and (.verification.official_ids_missing | length) == 0
            and .verification.identifiers_with_both_printing_and_variant == 0
          ' "$STACKR_REPORT_DIR/import-report.json"

      - name: Mirror and publicly verify every exact image
        run: >-
          node scripts/mirror-official-japanese-card-images.mjs
          --set-codes="$CANONICAL_SET_CODE"
          --concurrency=2
          --delay-ms=750
          --target=staging
          --apply
          --verify-public
          --report="$STACKR_REPORT_DIR/image-report.json"

      - name: Verify zero image gaps
        run: |
          jq -e '
            .ok == true
            and .production_modified == false
            and .candidate_variants == .ready_before + .processed_successfully
            and .remaining_after_run == 0
            and .failed == 0
            and .unverified_successes == []
            and .complete_for_requested_sets == true
            and .public_urls_verified == .processed_successfully
          ' "$STACKR_REPORT_DIR/image-report.json"

      - name: Create per-set completion report
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dir = process.env.STACKR_REPORT_DIR;
          const read = (name) => fs.existsSync(`${dir}/${name}`) ? JSON.parse(fs.readFileSync(`${dir}/${name}`, 'utf8')) : null;
          const source = read('source-catalogue.json');
          const imported = read('import-report.json');
          const images = read('image-report.json');
          const complete = Boolean(imported?.ok && images?.ok && images?.remaining_after_run === 0);
          const lines = [
            `### Japanese batch 3 — ${process.env.CANONICAL_SET_CODE}`,
            '',
            `Workflow run: **${process.env.GITHUB_RUN_ID}** — **${complete ? 'PASS' : 'FAILED/REVIEW REQUIRED'}**.`,
            '',
            '| Measure | Result |',
            '|---|---:|',
            `| Official source entries | ${source?.api_card_ids_collected ?? '—'} |`,
            `| Printed denominator | ${imported?.printed_total ?? source?.denominators?.join(', ') ?? '—'} |`,
            `| Full canonical total | ${imported?.full_total ?? '—'} |`,
            `| Distinct collector identities | ${imported?.verification?.distinct_collector_numbers ?? '—'} |`,
            `| Printings with variants | ${imported?.verification?.printings_with_variant ?? '—'} |`,
            `| Official IDs verified | ${imported?.verification?.official_ids_verified ?? '—'} |`,
            `| Unresolved concepts | ${imported?.verification?.unresolved_concepts ?? '—'} |`,
            `| Exact public images | ${images ? (images.ready_before + images.processed_successfully) : '—'} |`,
            `| Image failures | ${images?.failed ?? '—'} |`,
            `| Production modified | ${imported?.production_modified ?? false} |`,
            '',
            'A partition or numbering failure occurs before the import step, leaving staging unchanged for that set.',
          ];
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(`${dir}/summary.md`, `${lines.join('\n')}\n`);
          NODE

      - name: Upload immutable set evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackr-japanese-batch-3-${{ matrix.canonical_set_code }}-${{ github.run_id }}
          path: ${{ env.STACKR_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Report set outcome to PR 48
        if: always()
        shell: bash
        run: |
          body="$(cat "$STACKR_REPORT_DIR/summary.md")"
          gh api repos/${{ github.repository }}/issues/48/comments \
            --method POST \
            --field body="$body"
