name: Continue StackR Catalogue Production After Resume

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the replacement
        run: |
          echo 'Retired: normalize-resumed-catalogue-backfill-evidence.yml only validates and records evidence.'
          echo 'No deployment is dispatched. Use deploy-production.yml from main with release_scope=catalogue_assets and all unrelated mutation inputs disabled.'
          exit 1
