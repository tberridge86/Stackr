name: Probe Traditional Chinese set logos

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-a4-v2
    paths:
      - .github/scripts/probe_traditional_chinese_logos.py
      - .github/workflows/probe-traditional-chinese-logos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated artifact branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow requests ImageHash

      - name: Probe logo sources
        run: python .github/scripts/probe_traditional_chinese_logos.py

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: traditional-chinese-logo-probe
          path: build/tc-logo-probe/
          if-no-files-found: error
          retention-days: 3
