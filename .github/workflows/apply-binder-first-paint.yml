name: Apply binder first-paint patch

on:
  push:
    branches:
      - perf/binder-first-paint
    paths:
      - .github/workflows/apply-binder-first-paint.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact guarded source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one source match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/stackrApiV1.ts',
              "    query: { language?: StackrApiLanguageCode; cursor?: string | null; limit?: number } = {},",
              "    query: { language?: StackrApiLanguageCode; cursor?: string | null; limit?: number; includeAssets?: boolean } = {},",
          )

          replace_once(
              'lib/stackrDomainAdapter.ts',
              """      {\n        language: toStackrApiLanguage(language) ?? undefined,\n        cursor,\n        limit: 250,\n      },""",
              """      {\n        language: toStackrApiLanguage(language) ?? undefined,\n        cursor,\n        limit: 500,\n        includeAssets: false,\n      },""",
          )

          replace_once(
              'lib/stackrDomainAdapter.ts',
              """export function fetchPreferredStackrCardsForReferences(\n  references: string[],\n  language?: string | null,\n  client: StackrApiClient = stackrApiClient,\n) {""",
              """export function fetchPreferredStackrCardsForReferences(\n  references: string[],\n  language?: string | null,\n  client: StackrApiClient = stackrApiClient,\n  options: { includeAssets?: boolean } = {},\n) {""",
          )

          replace_once(
              'lib/stackrDomainAdapter.ts',
              """  ).then((rows) => {\n    // The preferred deadline governs the card facts only.""",
              """  ).then((rows) => {\n    if (options.includeAssets === false) return rows;\n    // The preferred deadline governs the card facts only.""",
          )

          replace_once(
              'lib/pokemonTcg.ts',
              """type FetchCardsForSetOptions = {\n  language?: PokemonCardLanguage | string | null;\n  preferCanonicalApi?: boolean;\n  /** A caller with a known set total must not retain a partial card response. */\n  minimumCardCount?: number | null;\n};""",
              """type FetchCardsForSetOptions = {\n  language?: PokemonCardLanguage | string | null;\n  preferCanonicalApi?: boolean;\n  includeAssets?: boolean;\n  /** A caller with a known set total must not retain a partial card response. */\n  minimumCardCount?: number | null;\n};""",
          )

          replace_once(
              'lib/pokemonTcg.ts',
              "  const cacheKey = `${readLane}:${language}:${setIdCandidates.join('|')}`;",
              "  const cacheKey = `${readLane}:${language}:${setIdCandidates.join('|')}:${options.includeAssets === false ? 'facts' : 'assets'}`;",
          )

          replace_once(
              'lib/pokemonTcg.ts',
              "      sourceCards = await fetchPreferredStackrCardsForReferences(setIdCandidates, language);",
              "      sourceCards = await fetchPreferredStackrCardsForReferences(setIdCandidates, language, undefined, { includeAssets: options.includeAssets !== false });",
          )

          replace_once(
              'lib/pokemonTcg.ts',
              """    const cards = await attachLiveTcgdexCardReferences(\n      sourceCards.map(fromStackrCard),\n      1,\n    );""",
              """    const mappedCards = sourceCards.map(fromStackrCard);\n    const cards = options.includeAssets === false\n      ? mappedCards\n      : await attachLiveTcgdexCardReferences(mappedCards, 1);""",
          )

          replace_once(
              'lib/binders.ts',
              """export async function fetchBinderCards(\n  binderId: string,\n  options: { includePrices?: boolean } = {},\n): Promise<BinderCardRecord[]> {""",
              """export async function fetchBinderCards(\n  binderId: string,\n  options: { includePrices?: boolean; includeAssets?: boolean } = {},\n): Promise<BinderCardRecord[]> {""",
          )

          replace_once(
              'lib/binders.ts',
              "    `binder:${binderId}:${options.includePrices === false ? 'unpriced-cards' : 'cards'}`,",
              "    `binder:${binderId}:${options.includePrices === false ? 'unpriced-cards' : 'cards'}:${options.includeAssets === false ? 'facts' : 'assets'}`,",
          )

          replace_once(
              'lib/binders.ts',
              """async function fetchBinderCardsUncached(\n  binderId: string,\n  options: { includePrices?: boolean; onCatalogueUnavailable?: () => void } = {},\n): Promise<BinderCardRecord[]> {""",
              """async function fetchBinderCardsUncached(\n  binderId: string,\n  options: { includePrices?: boolean; includeAssets?: boolean; onCatalogueUnavailable?: () => void } = {},\n): Promise<BinderCardRecord[]> {""",
          )

          replace_once(
              'lib/binders.ts',
              """  const setCards = await fetchCardsForSet(binder.catalogue_set_id ?? binder.source_set_id, {\n    language: binderLanguage,\n    preferCanonicalApi: true,""",
              """  const setCards = await fetchCardsForSet(binder.catalogue_set_id ?? binder.source_set_id, {\n    language: binderLanguage,\n    preferCanonicalApi: true,\n    includeAssets: options.includeAssets,""",
          )

          replace_once(
              'features/binder/BinderDetailScreen.tsx',
              "() => fetchBinderCards(binderId, { includePrices: false }),",
              "() => fetchBinderCards(binderId, { includePrices: false, includeAssets: false }),",
          )

          replace_once(
              'features/binder/BinderDetailScreen.tsx',
              """      setCards(binderCards);\n      setLoading(false);\n\n      // Pricing is supplemental to the immediately usable catalogue/ownership""",
              """      setCards(binderCards);\n      setLoading(false);\n\n      // Artwork is supplemental to first paint. Fetch the enriched set once in\n      // the background and merge only image presentation so ownership, grading,\n      // quantities and other user state can never be overwritten by enrichment.\n      void fetchBinderCards(binderId, { includePrices: false, includeAssets: true })\n        .then((enrichedCards) => {\n          if (!isCurrentRequest()) return;\n          const artworkByCardAndSet = new Map(\n            enrichedCards.map((card) => [`${card.set_id}\\u0000${card.card_id}`, card])\n          );\n          setCards((currentCards) => currentCards.map((card) => {\n            const enriched = artworkByCardAndSet.get(`${card.set_id}\\u0000${card.card_id}`);\n            if (!enriched) return card;\n            const small = enriched.card?.images?.small ?? enriched.image_url ?? null;\n            const large = enriched.card?.images?.large ?? null;\n            if (!small && !large) return card;\n            return {\n              ...card,\n              image_url: small ?? card.image_url,\n              card: {\n                ...(enriched.card ?? {}),\n                ...(card.card ?? {}),\n                images: {\n                  ...(card.card?.images ?? {}),\n                  small: small ?? card.card?.images?.small ?? card.image_url ?? null,\n                  large: large ?? card.card?.images?.large ?? null,\n                },\n              },\n            };\n          }));\n        })\n        .catch((error) => {\n          console.log('Binder artwork enrichment failed:', error);\n        });\n\n      // Pricing is supplemental to the immediately usable catalogue/ownership""",
          )

          Path('scripts/test-binder-first-paint.ts').write_text(r'''import fs from 'node:fs';

function expect(source: string, needle: string, message: string) {
  if (!source.includes(needle)) throw new Error(message);
}

const api = fs.readFileSync('lib/stackrApiV1.ts', 'utf8');
const domain = fs.readFileSync('lib/stackrDomainAdapter.ts', 'utf8');
const pokemon = fs.readFileSync('lib/pokemonTcg.ts', 'utf8');
const binders = fs.readFileSync('lib/binders.ts', 'utf8');
const screen = fs.readFileSync('features/binder/BinderDetailScreen.tsx', 'utf8');

expect(api, 'includeAssets?: boolean', 'setCards client must accept includeAssets');
expect(domain, 'limit: 500,\n        includeAssets: false,', 'canonical set facts must use one facts-only page');
expect(domain, 'if (options.includeAssets === false) return rows;', 'preferred canonical facts must be able to skip artwork enrichment');
expect(pokemon, "options.includeAssets === false ? 'facts' : 'assets'", 'set-card caches must isolate facts from artwork');
expect(pokemon, 'options.includeAssets === false\n      ? mappedCards', 'facts-only reads must not wait for live provider artwork');
expect(binders, "options.includeAssets === false ? 'facts' : 'assets'", 'binder cache must isolate first paint from enriched rows');
expect(binders, 'includeAssets: options.includeAssets,', 'binder must pass artwork intent into catalogue read');
expect(screen, 'includePrices: false, includeAssets: false', 'binder first paint must request facts only');
expect(screen, 'includePrices: false, includeAssets: true', 'binder must enrich artwork after first paint');
expect(screen, '...card,\n              image_url:', 'artwork merge must preserve the current ownership/state row');

console.log('Binder first-paint invariants passed.');
''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate focused binder paths
        run: |
          npm run typecheck
          npm run test:binder-catalogue
          npm run test:personal-loading
          node --import tsx scripts/test-binder-first-paint.ts
          git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch produced' >&2
            exit 1
          fi
          git config user.name 'stackr-performance-bot'
          git config user.email 'stackr-performance-bot@users.noreply.github.com'
          git add lib/stackrApiV1.ts lib/stackrDomainAdapter.ts lib/pokemonTcg.ts lib/binders.ts features/binder/BinderDetailScreen.tsx scripts/test-binder-first-paint.ts
          git commit -m 'Render binder facts before artwork enrichment'
          git push origin HEAD:perf/binder-first-paint
