name: Probe TCGdex logo paths

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-a4-v2
    paths:
      - .github/scripts/probe_tcgdex_logo_paths.py
      - .github/workflows/probe-tcgdex-logo-paths.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python .github/scripts/probe_tcgdex_logo_paths.py
      - uses: actions/upload-artifact@v4
        with:
          name: tcgdex-logo-path-probe
          path: build/tcgdex-logo-path-probe/
          if-no-files-found: warn
          retention-days: 3
