name: Publish Stackr Artwork Batches

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Frozen artwork batch
        required: true
        type: choice
        default: artwork-next-push-20261013
        options:
          - artwork-next-push-20261013
          - japanese-artwork-release-20261023
      confirmation:
        description: Type PUBLISH ARTWORK BATCHES
        required: true
        type: string
      expected_main_sha:
        description: Exact main revision containing the frozen batch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stackr-production-deployment
  cancel-in-progress: false

jobs:
  artwork_next_push:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH ARTWORK BATCHES'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Validate the exact artwork-only batch
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Select the frozen receipt directory
        id: batch
        env:
          BATCH: ${{ inputs.batch || 'artwork-next-push-20261013' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BATCH" in
            artwork-next-push-20261013) echo "output=$RUNNER_TEMP/artwork-next-push" >> "$GITHUB_OUTPUT" ;;
            japanese-artwork-release-20261023) echo "output=$RUNNER_TEMP/japanese-artwork-release" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Install locked publisher dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify batch, transaction and archive guards
        run: |
          node --test tools/artwork-next-push-20261013/publish.test.mjs tools/artwork3303-publish-20260928/publish.test.mjs tools/artwork3303-publish-20260928/native-name-corrections.test.mjs
          python tools/artwork-next-push-20261013/download-package.test.py
          node --test tools/japanese-artwork-release-20261023/publish.test.mjs tools/japanese-artwork-release-20261023/prepare.test.mjs tools/japanese-artwork-release-20261023/frozen.test.mjs
      - name: Verify persisted failure receipts
        run: node --test tools/artwork3303-publish-20260928/journal.integration.test.mjs
      - name: Retrieve the frozen image package
        if: inputs.batch == 'artwork-next-push-20261013' || inputs.batch == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/artwork-next-push-20261013/download-package.py "$RUNNER_TEMP/artwork-next-push-packages"
      - name: Rehearse and publish the frozen artwork batch
        if: inputs.batch == 'artwork-next-push-20261013' || inputs.batch == ''
        env:
          STACKR_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STACKR_ARTWORK_NEXT_PUSH_CONFIRMATION: PUBLISH ARTWORK NEXT PUSH
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_SECRET_KEY: ${{ secrets.SUPABASE_PRODUCTION_SECRET_KEY }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STACKR_ARTWORK_NEXT_PUSH_PACKAGES: ${{ runner.temp }}/artwork-next-push-packages
          STACKR_ARTWORK_NEXT_PUSH_OUTPUT: ${{ runner.temp }}/artwork-next-push
        run: node tools/artwork-next-push-20261013/publish.mjs --execute
      - name: Prepare the frozen Japanese image package
        if: inputs.batch == 'japanese-artwork-release-20261023'
        run: node tools/japanese-artwork-release-20261023/prepare.mjs "$RUNNER_TEMP/japanese-artwork-packages"
      - name: Rehearse and publish the frozen Japanese artwork
        if: inputs.batch == 'japanese-artwork-release-20261023'
        env:
          STACKR_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STACKR_JAPANESE_ARTWORK_CONFIRMATION: PUBLISH JAPANESE ARTWORK
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_SECRET_KEY: ${{ secrets.SUPABASE_PRODUCTION_SECRET_KEY }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STACKR_JAPANESE_ARTWORK_PACKAGES: ${{ runner.temp }}/japanese-artwork-packages
          STACKR_JAPANESE_ARTWORK_OUTPUT: ${{ runner.temp }}/japanese-artwork-release
          STACKR_JAPANESE_ARTWORK_PRIVATE_OUTPUT: ${{ runner.temp }}/japanese-artwork-private
        run: node tools/japanese-artwork-release-20261023/publish.mjs --execute
      - name: Scan publication evidence for secrets
        id: artwork_receipt_scan
        if: always()
        env:
          RECEIPT_DIRECTORY: ${{ steps.batch.outputs.output }}
        run: node scripts/deploy/secret-scan.mjs --directory="$RECEIPT_DIRECTORY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.artwork_receipt_scan.outcome == 'success'
        with:
          name: artwork-batch-${{ inputs.batch || 'artwork-next-push-20261013' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.batch.outputs.output }}
          retention-days: 90
          if-no-files-found: warn
