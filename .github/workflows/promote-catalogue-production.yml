name: Retired - Promote StackR Catalogue to Production

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      confirmation:
        description: This workflow is retired; use deploy-production.yml with catalogue_assets
        required: true
        type: string
      backfill_run_id:
        description: Legacy evidence run ID recorded for audit only
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: stackr-retired-catalogue-production-promotion
  cancel-in-progress: false

jobs:
  retired:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 48 &&
      github.event.comment.body == '/promote-stackr-catalogue-production-2026-08-19')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record fail-closed canonical handoff
        env:
          LEGACY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || github.event.comment.body }}
          LEGACY_EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          canonical_url="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml"
          {
            echo '## Retired catalogue production workflow blocked'
            echo
            echo 'This legacy entry point cannot check out code, access production credentials, dispatch another workflow, or mutate production.'
            echo
            echo "Use the canonical production deployment workflow: ${canonical_url}"
            echo
            echo 'Required catalogue-only settings: `release_scope=catalogue_assets`, `apply_migrations=false`, `publish_mobile_update=false`, `promote_gateway=false`, and `gateway_bootstrap=false`.'
            echo
            printf '%s\n' "Legacy confirmation: ${LEGACY_CONFIRMATION:-not supplied}"
            printf '%s\n' "Legacy evidence run ID: ${LEGACY_EVIDENCE_RUN_ID:-not supplied}"
            printf '%s\n' "Blocked run: ${GITHUB_RUN_ID}; source SHA: ${GITHUB_SHA}; actor: ${GITHUB_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=Retired production workflow::No production action was taken. Use deploy-production.yml with release_scope=catalogue_assets.'
          exit 1

      - name: Record legacy comment handoff
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            --method POST \
            --field body="Legacy catalogue promotion run **${GITHUB_RUN_ID}** was blocked without production access or mutation. Use **Deploy Stackr Production Canary** from \`deploy-production.yml\` with \`release_scope=catalogue_assets\` and all migration/mobile/gateway mutation inputs disabled."
