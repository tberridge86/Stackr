name: One-shot retrieval migration fixture repair

on:
  push:
    branches: [agent/performance/retrieval-500ms]
    paths: [.github/workflows/repair-retrieval-migration-fixture.yml]

permissions:
  contents: read

jobs:
  update-known-fixture:
    if: github.repository == 'tberridge86/Stackr' && github.ref == 'refs/heads/agent/performance/retrieval-500ms'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply only the reviewed migration-list fixture delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object scripts/test-deployment-tooling.mjs)" = '9c561b91523ec4f7cb8303cf8ec79c3b8fe56ac3'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-deployment-tooling.mjs')
          source = path.read_text()
          replacements = [
            ('// The repository ledger is twenty-five additional migrations ahead of the last',
             '// The repository ledger is twenty-six additional migrations ahead of the last'),
            ("// collector-search migrations recovered from production's 9 September ledger. These\n  // additions do not revise the frozen staging evidence or approve deployment.",
             "// collector-search migrations recovered from production's 9 September ledger,\n  // and the guarded binder RLS optimisation prepared on 11 September (unapplied).\n  // These additions do not revise frozen staging evidence or approve deployment."),
            ('assert.equal(reconciliation.localMigrationFileCount, reconciliation.stagingMigrationHistoryCount + 25);',
             'assert.equal(reconciliation.localMigrationFileCount, reconciliation.stagingMigrationHistoryCount + 26);'),
            ("assert.equal(localMigrations.at(-1), '20260909133639_collector_search_identity_view.sql');",
             "assert.equal(localMigrations.at(-1), '20260911075500_optimize_binder_rls_reads.sql');"),
            ('assert.deepEqual(localMigrations.slice(-17), [',
             'assert.deepEqual(localMigrations.slice(-18), ['),
            ("    '20260909133639_collector_search_identity_view.sql',\n  ]);",
             "    '20260909133639_collector_search_identity_view.sql',\n    '20260911075500_optimize_binder_rls_reads.sql',\n  ]);"),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit('Fixture source drift; refusing an ambiguous patch')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          node --check scripts/test-deployment-tooling.mjs
          git diff --check
          test "$(git diff --name-only)" = 'scripts/test-deployment-tooling.mjs'
          git diff --stat
          # Normal fast-forward push only. A concurrent branch update must fail,
          # never be force-pushed away. This job cannot write main or deploy.
          test "$(git ls-remote origin refs/heads/agent/performance/retrieval-500ms | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Stackr performance fixture repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-deployment-tooling.mjs
          git commit -m 'test(deploy): recognise the pending binder RLS migration without relaxing release gates'
          git push origin HEAD:refs/heads/agent/performance/retrieval-500ms
          echo 'Fixture updated. Full CI must run again on the resulting reviewed branch head.'
