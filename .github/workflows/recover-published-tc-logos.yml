name: Recover published Traditional Chinese logo files
on:
  push:
    branches: [artifact/traditional-chinese-logos-a4-v2]
    paths:
      - .github/scripts/recover_published_tc_logos_v3.py
      - .github/workflows/recover-published-tc-logos.yml
permissions:
  contents: read
concurrency:
  group: tc-published-logo-retrieval
  cancel-in-progress: true
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.5 Pillow==11.3.0 opencc-python-reimplemented==0.1.7
      - run: python -u .github/scripts/recover_published_tc_logos_v3.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tc-published-logo-recovery-v3
          path: build/tc-published-recovery-v3/
          retention-days: 3
          if-no-files-found: error
