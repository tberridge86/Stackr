name: Audit focused official Simplified Chinese product pages

on:
  push:
    branches:
      - artifacts/sc-set-image-retry-20260911
    paths:
      - artifact-jobs/simplified-chinese-set-logos/official_candidate_audit_extra.py
      - .github/workflows/audit-official-sc-product-candidates-extra.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow reportlab beautifulsoup4
      - name: Download focused official image candidates
        working-directory: artifact-jobs/simplified-chinese-set-logos
        run: python official_candidate_audit_extra.py
      - uses: actions/upload-artifact@v4
        with:
          name: focused-official-simplified-chinese-product-candidates
          path: artifact-jobs/simplified-chinese-set-logos/official-candidate-audit-extra/
          if-no-files-found: error
          retention-days: 14
          compression-level: 8
