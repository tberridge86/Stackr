name: Probe Pokecardex Japanese set-logo CDN

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-a4-v2
    paths:
      - .github/scripts/probe_pokecardex_logos.py
      - .github/workflows/probe-pokecardex-logos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python .github/scripts/probe_pokecardex_logos.py
      - uses: actions/upload-artifact@v4
        with:
          name: pokecardex-logo-probe
          path: build/pokecardex-logo-probe/
          if-no-files-found: error
          retention-days: 3
