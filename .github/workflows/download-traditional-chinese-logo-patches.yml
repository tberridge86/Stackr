name: Download Traditional Chinese logo patches

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-v2-20260912
    paths:
      - .github/scripts/download_traditional_chinese_logo_patches.py
      - .github/workflows/download-traditional-chinese-logo-patches.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pillow
      - run: python .github/scripts/download_traditional_chinese_logo_patches.py
      - uses: actions/upload-artifact@v4
        with:
          name: traditional-chinese-logo-patches
          path: build/tw-logo-patches/
          if-no-files-found: error
          retention-days: 3
