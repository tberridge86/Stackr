name: Production API Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stackr-production-api-monitor
  cancel-in-progress: true

jobs:
  public-smoke:
    if: github.event_name == 'workflow_dispatch' || vars.STACKR_PRODUCTION_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STACKR_BACKEND_URL: ${{ vars.STACKR_BACKEND_URL || 'https://pocketvault-production.up.railway.app' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify production catalogue API, backend commerce lock, and CDN
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STACKR_BACKEND_URL"
          node scripts/deploy/smoke.mjs \
            --gateway=https://api.stackrtcg.com \
            --backend="$STACKR_BACKEND_URL" \
            --full-gateway \
            --require-commerce-disabled \
            --require-published-catalogue \
            --required-catalogue-languages=en,ja,zh-tw,zh-cn,ko \
            --allowed-origin=https://stackr.app
      - name: Open or update production API incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='Production API monitor failure'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue_number="$(gh issue list --state open --search '"Production API monitor failure" in:title' \
            --json number,title --jq '.[] | select(.title == "Production API monitor failure") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "The production API monitor failed again. Run: $run_url"
          else
            gh issue create --title "$title" \
              --body "The production API monitor failed. Run: $run_url"
          fi
      - name: Resolve recovered production API incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue_number="$(gh issue list --state open --search '"Production API monitor failure" in:title' \
            --json number,title --jq '.[] | select(.title == "Production API monitor failure") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "The production API monitor recovered. Run: $run_url"
            gh issue close "$issue_number" --reason completed
          fi
