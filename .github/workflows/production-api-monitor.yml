name: Production API Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackr-production-api-monitor
  cancel-in-progress: true

jobs:
  public-smoke:
    if: github.event_name == 'workflow_dispatch' || vars.STACKR_PRODUCTION_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify production catalogue API and CDN
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if node scripts/deploy/smoke.mjs \
              --gateway=https://api.stackrtcg.com \
              --full-gateway \
              --require-published-catalogue \
              --required-catalogue-languages=en,ja,zh-tw,zh-cn,ko \
              --allowed-origin=https://stackr.app; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
