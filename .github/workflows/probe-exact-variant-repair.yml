name: Probe StackR Exact Variant Repair

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 48 &&
      github.actor == 'tberridge86' &&
      github.event.comment.body == '/probe-stackr-exact-variant-repair-2026-08-19')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a2320cba976ea6cb50bde9afcc202f1e982ade5f
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read exact repair state without changing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/catalogue
          script_path="$GITHUB_WORKSPACE/.stackr-probe-exact-repair.mjs"
          cat > "$script_path" <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { createClient } from '@supabase/supabase-js';
          const url = String(process.env.SUPABASE_URL || '');
          const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_SECRET_KEY || '');
          if (!url.includes('lmwfhvexfcoyeuoyrlco') || !key) throw new Error('canonical_staging_credentials_unavailable');
          const db = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
          const { data: sources, error: sourceError } = await db.schema('ingest').from('sources').select('*').eq('code', 'tcgdex').limit(1);
          if (sourceError) throw sourceError;
          const sourceId = sources?.[0]?.id;
          if (!sourceId) throw new Error('tcgdex_source_missing');
          const { data: runs, error: runError } = await db.schema('ingest').from('import_runs').select('*')
            .eq('source_id', sourceId)
            .ilike('run_key', '%tcgdex-primary-variant-policy-repair%')
            .order('started_at', { ascending: false })
            .limit(20);
          if (runError) throw runError;
          const runIds = (runs || []).map((row) => row.id);
          let rawRecords = [];
          let conflicts = [];
          if (runIds.length) {
            const rawQuery = await db.schema('ingest').from('raw_source_records').select('*').in('import_run_id', runIds).order('retrieved_at', { ascending: true });
            if (rawQuery.error) throw rawQuery.error;
            rawRecords = rawQuery.data || [];
            const conflictQuery = await db.schema('ingest').from('data_conflicts').select('*').in('import_run_id', runIds).order('created_at', { ascending: true });
            if (conflictQuery.error) throw conflictQuery.error;
            conflicts = conflictQuery.data || [];
          }
          const externalIds = ['sv03-016','sv03-016:holo','sv03-016:reverse_holo','sv03-017','sv03-017:holo','sv03-017:reverse_holo'];
          const identifierQuery = await db.schema('ingest').from('external_identifiers').select('*')
            .eq('source_id', sourceId)
            .eq('source_entity_type', 'card')
            .eq('language_code', 'en')
            .in('external_id', externalIds)
            .order('external_id', { ascending: true });
          if (identifierQuery.error) throw identifierQuery.error;
          const identifiers = identifierQuery.data || [];
          const variantIds = [...new Set(identifiers.map((row) => row.variant_id).filter(Boolean))];
          let variants = [];
          if (variantIds.length) {
            const variantQuery = await db.schema('catalog').from('card_variants').select('*').in('id', variantIds).order('variant_code', { ascending: true });
            if (variantQuery.error) throw variantQuery.error;
            variants = variantQuery.data || [];
          }
          const historicConflictIds = ['ee9f37ab-5fb3-422c-9313-3cfb7cdb88e3','0b27bb73-dd33-454e-9dc3-9c7085cc94d9'];
          const historicQuery = await db.schema('ingest').from('data_conflicts').select('*').in('id', historicConflictIds).order('created_at', { ascending: true });
          if (historicQuery.error) throw historicQuery.error;
          const report = {
            schemaVersion: 1,
            probedAt: new Date().toISOString(),
            readOnly: true,
            projectRef: 'lmwfhvexfcoyeuoyrlco',
            runs,
            rawRecords: rawRecords.map((row) => ({
              id: row.id, importRunId: row.import_run_id, externalId: row.external_id,
              recordType: row.record_type, validationStatus: row.validation_status,
              validationErrors: row.validation_errors, retrievedAt: row.retrieved_at,
            })),
            repairConflicts: conflicts,
            identifiers,
            variants,
            historicConflicts: historicQuery.data || [],
          };
          writeFileSync('reports/catalogue/exact-variant-repair-probe.json', JSON.stringify(report, null, 2) + '\n');
          const variantById = new Map(variants.map((row) => [row.id, row]));
          console.log(JSON.stringify({
            runs: (runs || []).map((row) => ({
              id: row.id, runKey: row.run_key, status: row.status,
              requested: row.records_requested, retrieved: row.records_retrieved,
              inserted: row.records_inserted, updated: row.records_updated,
              skipped: row.records_skipped, conflicted: row.records_conflicted,
              error: row.error_message, startedAt: row.started_at, finishedAt: row.finished_at,
            })),
            rawRecords: report.rawRecords,
            repairConflicts: conflicts.map((row) => ({ id: row.id, type: row.conflict_type, severity: row.severity, status: row.status, notes: row.internal_notes })),
            identifiers: identifiers.map((row) => ({
              externalId: row.external_id, current: row.is_current, deprecatedAt: row.deprecated_at,
              variantId: row.variant_id, variantCode: variantById.get(row.variant_id)?.variant_code || null,
              finishCode: variantById.get(row.variant_id)?.finish_code || null,
            })),
            historicConflicts: (historicQuery.data || []).map((row) => ({ id: row.id, status: row.status, resolvedAt: row.resolved_at, resolutionNotes: row.resolution_notes })),
          }));
          NODE
          summary="$(
            npx --yes @railway/cli@5.30.1 run \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_BACKEND_SERVICE_ID" \
              --no-local \
              node "$script_path" | tail -n 1
          )"
          rm -f "$script_path"
          echo "$summary" > reports/catalogue/exact-variant-repair-probe-summary.json
          body="$(SUMMARY="$summary" node <<'NODE'
          const value = JSON.parse(process.env.SUMMARY);
          const runs = value.runs.length ? value.runs.map((r) => `- \`${r.runKey}\`: ${r.status}; retrieved ${r.retrieved || 0}, inserted ${r.inserted || 0}, updated ${r.updated || 0}, conflicts ${r.conflicted || 0}; error ${r.error || 'none'}`).join('\n') : '- no repair run rows';
          const ids = value.identifiers.map((r) => `- \`${r.externalId}\` → ${r.variantCode || 'unknown'}/${r.finishCode || 'unknown'} (${r.current ? 'current' : 'not current'})`).join('\n');
          const historic = value.historicConflicts.map((r) => `- ${r.id}: ${r.status}; resolved ${r.resolvedAt || 'no'}`).join('\n');
          process.stdout.write(`### Exact variant repair staging probe\nRepair runs:\n${runs}\n\nCurrent identifiers:\n${ids}\n\nHistoric conflicts:\n${historic}`);
          NODE
          )"
          gh api repos/${GITHUB_REPOSITORY}/issues/48/comments --method POST --field body="$body"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stackr-exact-variant-repair-probe-${{ github.run_id }}
          path: reports/catalogue/exact-variant-repair-probe*.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
