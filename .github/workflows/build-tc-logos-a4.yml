name: Build corrected Traditional Chinese A4 logo sheets

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-a4-v2
    paths:
      - .github/scripts/build_tc_logos_a4.py
      - .github/workflows/build-tc-logos-a4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out isolated artifact branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Build A4 sheets
        run: python .github/scripts/build_tc_logos_a4.py

      - name: Upload finished pack
        uses: actions/upload-artifact@v4
        with:
          name: traditional-chinese-set-logos-a4-v2
          path: build/traditional-chinese-set-logos/
          if-no-files-found: error
          retention-days: 3
