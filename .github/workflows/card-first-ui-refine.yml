name: Refine guarded card-first candidate
on:
  push:
    branches: [agent/release/card-first-browse-ui]
    paths: ['.github/workflows/card-first-ui-refine.yml']
permissions:
  contents: write
jobs:
  refine:
    if: github.repository == 'tberridge86/Stackr' && github.ref == 'refs/heads/agent/release/card-first-browse-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python scripts/.refine-card-first.py
      - name: Publish source changes to candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/agent/release/card-first-browse-ui
