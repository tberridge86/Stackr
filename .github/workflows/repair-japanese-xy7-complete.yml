name: Repair Japanese XY7 Complete Catalogue

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REPAIR XY7 TO 92 CARDS IN STAGING
        required: true
        type: string
  push:
    branches:
      - backend/release-hardening-2026-08-19
    paths:
      - '.github/workflows/repair-japanese-xy7-complete.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stackr-repair-japanese-xy7-complete
  cancel-in-progress: false

jobs:
  repair-xy7:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'REPAIR XY7 TO 92 CARDS IN STAGING')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_URL: https://lmwfhvexfcoyeuoyrlco.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      STACKR_CATALOGUE_IMPORT_TARGET: staging
      STACKR_REPORT_DIR: reports/catalogue/japanese-xy7-repair
      CANONICAL_SET_CODE: XY7
      RELEASE_DATE: '2015-06-20'
      ENGLISH_NAME: 'Bandit Ring'

    steps:
      - name: Announce the factual correction
        run: >-
          gh api repos/${{ github.repository }}/issues/48/comments
          --method POST
          --field body="XY7 correction **${GITHUB_RUN_ID}** started. The earlier green run contained only secret cards 082–092 because the official site splits Bandit Ring across \`XY7-B\` (001–081) and \`XY7\` (082–092). This run will merge both filters into a truthful **92-card** canonical set, preserve both source codes, mirror all images and leave production untouched."

      - name: Check out reviewed catalogue automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: backend/release-hardening-2026-08-19
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate hard-pinned staging target
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_URL" = 'https://lmwfhvexfcoyeuoyrlco.supabase.co'
          test -n "$SUPABASE_SECRET_KEY"
          case "$SUPABASE_URL" in
            *oakdbbzdqwurpjnoqhmu*) echo 'Production target detected; refusing XY7 repair.'; exit 1 ;;
          esac
          mkdir -p "$STACKR_REPORT_DIR"

      - name: Install pinned dependencies
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check --no-input beautifulsoup4==4.13.4

      - name: Syntax-check repair programs
        run: |
          python3 -m py_compile scripts/collect-official-japanese-set-metadata-v2.py
          python3 -m py_compile scripts/merge-official-japanese-set-reports.py
          node --check scripts/import-complete-official-japanese-set.mjs
          node --check scripts/persist-official-japanese-multi-code-provenance.mjs
          node --check scripts/mirror-official-japanese-card-images.mjs

      - name: Collect the 81-card base filter
        run: >-
          python3 scripts/collect-official-japanese-set-metadata-v2.py
          --set-code=XY7-B
          --output="$STACKR_REPORT_DIR/xy7-base.json"
          --max-results=200
          --minimum-delay-ms=650

      - name: Collect the 11-card secret filter
        run: >-
          python3 scripts/collect-official-japanese-set-metadata-v2.py
          --set-code=XY7
          --output="$STACKR_REPORT_DIR/xy7-secret.json"
          --max-results=200
          --minimum-delay-ms=650

      - name: Verify both official source partitions
        run: |
          jq -e '
            .set_code_requested == "XY7-B"
            and .official_set_codes == ["XY7-B"]
            and .api_card_ids_collected == 81
            and .unique_printings == 81
            and .denominators == ["081"]
            and (.parser_errors | length) == 0
            and (.identity_conflicts | length) == 0
          ' "$STACKR_REPORT_DIR/xy7-base.json"
          jq -e '
            .set_code_requested == "XY7"
            and .official_set_codes == ["XY7"]
            and .api_card_ids_collected == 11
            and .unique_printings == 11
            and .denominators == ["081"]
            and ([.printings[].collector_number | tonumber] | min) == 82
            and ([.printings[].collector_number | tonumber] | max) == 92
            and (.parser_errors | length) == 0
            and (.identity_conflicts | length) == 0
          ' "$STACKR_REPORT_DIR/xy7-secret.json"

      - name: Merge the official partitions into one canonical manifest
        run: >-
          python3 scripts/merge-official-japanese-set-reports.py
          --input="$STACKR_REPORT_DIR/xy7-base.json"
          --input="$STACKR_REPORT_DIR/xy7-secret.json"
          --canonical-set-code="$CANONICAL_SET_CODE"
          --output="$STACKR_REPORT_DIR/catalogue.json"

      - name: Verify the truthful combined denominator
        run: |
          jq -e '
            .set_code_requested == "XY7"
            and .official_set_codes == ["XY7", "XY7-B"]
            and .api_card_ids_collected == 92
            and .unique_printings == 92
            and .denominators == ["081"]
            and ([.printings[].collector_number | tonumber] | min) == 1
            and ([.printings[].collector_number | tonumber] | max) == 92
            and ([.printings[].collector_number] | unique | length) == 92
          ' "$STACKR_REPORT_DIR/catalogue.json"

      - name: Replace the false 11-card result with all 92 printings
        run: >-
          node scripts/import-complete-official-japanese-set.mjs
          --input="$STACKR_REPORT_DIR/catalogue.json"
          --canonical-set-code="$CANONICAL_SET_CODE"
          --official-set-code="$CANONICAL_SET_CODE"
          --release-date="$RELEASE_DATE"
          --english-name="$ENGLISH_NAME"
          --target=staging
          --apply
          --report="$STACKR_REPORT_DIR/import-report.json"

      - name: Preserve both official set-code identities
        run: >-
          node scripts/persist-official-japanese-multi-code-provenance.mjs
          --input="$STACKR_REPORT_DIR/catalogue.json"
          --canonical-set-code="$CANONICAL_SET_CODE"
          --target=staging
          --apply
          --report="$STACKR_REPORT_DIR/provenance-report.json"

      - name: Mirror and verify all 92 official images
        run: >-
          node scripts/mirror-official-japanese-card-images.mjs
          --set-codes="$CANONICAL_SET_CODE"
          --concurrency=2
          --delay-ms=750
          --target=staging
          --apply
          --verify-public
          --report="$STACKR_REPORT_DIR/image-report.json"

      - name: Verify the corrected end state
        run: |
          jq -e '
            .ok == true
            and .printed_total == 81
            and .full_total == 92
            and .verification.active_printings == 92
            and .verification.distinct_collector_numbers == 92
            and .verification.printings_with_variant == 92
            and .verification.official_ids_verified == 92
            and .verification.unresolved_concepts == 0
          ' "$STACKR_REPORT_DIR/import-report.json"
          jq -e '
            .ok == true
            and .official_set_codes == ["XY7", "XY7-B"]
            and .set_identifiers_verified == ["XY7", "XY7-B"]
            and .card_provenance_rows_updated == 92
          ' "$STACKR_REPORT_DIR/provenance-report.json"
          jq -e '
            .ok == true
            and .candidate_variants == 92
            and .remaining_after_run == 0
            and (.ready_before + .processed_successfully) == 92
            and .failed == 0
          ' "$STACKR_REPORT_DIR/image-report.json"

      - name: Build correction summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dir = process.env.STACKR_REPORT_DIR;
          const read = (name) => fs.existsSync(`${dir}/${name}`) ? JSON.parse(fs.readFileSync(`${dir}/${name}`, 'utf8')) : null;
          const imported = read('import-report.json');
          const provenance = read('provenance-report.json');
          const images = read('image-report.json');
          const lines = [
            '### Japanese catalogue correction — XY7',
            '',
            `Workflow run: **${process.env.GITHUB_RUN_ID}** — **${imported?.ok && provenance?.ok && images?.ok ? 'PASS' : 'FAILED/INCOMPLETE'}**.`,
            '',
            '| Measure | Result |',
            '|---|---:|',
            '| Previous false total | 11 |',
            `| Correct printed denominator | ${imported?.printed_total ?? '—'} |`,
            `| Correct full checklist total | ${imported?.full_total ?? '—'} |`,
            `| Official source partitions | ${provenance?.official_set_codes?.join(', ') ?? '—'} |`,
            `| Distinct printings | ${imported?.verification?.distinct_collector_numbers ?? '—'} |`,
            `| Printings with variants | ${imported?.verification?.printings_with_variant ?? '—'} |`,
            `| Official IDs verified | ${imported?.verification?.official_ids_verified ?? '—'} |`,
            `| Exact images available | ${(images?.ready_before ?? 0) + (images?.processed_successfully ?? 0)} |`,
            `| Image failures | ${images?.failed ?? '—'} |`,
            `| Production modified | ${imported?.production_modified ?? false} |`,
            '',
            'The false green result has been replaced, not hidden. `XY7-B` remains the provenance for cards 001–081 and `XY7` remains the provenance for cards 082–092.',
          ];
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(`${dir}/summary.md`, `${lines.join('\n')}\n`);
          NODE

      - name: Upload immutable correction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackr-japanese-xy7-repair-${{ github.run_id }}
          path: ${{ env.STACKR_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Report correction outcome to PR 48
        if: always()
        shell: bash
        run: |
          body="$(cat "$STACKR_REPORT_DIR/summary.md")"
          gh api repos/${{ github.repository }}/issues/48/comments \
            --method POST \
            --field body="$body"
