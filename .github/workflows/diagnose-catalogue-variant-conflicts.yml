name: Diagnose StackR Catalogue Variant Conflicts

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stackr-catalogue-variant-diagnostics-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 48 &&
      github.actor == 'tberridge86' &&
      github.event.comment.body == '/diagnose-stackr-variant-conflicts-2026-08-19')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
      CATALOGUE_VERSION: tcgdex-796afd47e430-full-primary-2026-08-19
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Announce read-only diagnostics
        run: >-
          gh api repos/${{ github.repository }}/issues/48/comments
          --method POST
          --field body="Read-only variant conflict diagnostics **${GITHUB_RUN_ID}** started for \`sv03-016\` and \`sv03-017\`. No identifiers or catalogue rows will be changed."

      - name: Check out the reviewed dependency lock
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a65c495fefa6d41e6bda501d2c7ab307bd43bf8c
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Inspect conflicts, identifiers, variants and source payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/catalogue
          script_path="$GITHUB_WORKSPACE/.stackr-diagnose-variant-conflicts.mjs"
          cat > "$script_path" <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { createClient } from '@supabase/supabase-js';

          const targetIds = ['sv03-016', 'sv03-017'];
          const url = String(process.env.SUPABASE_URL || '');
          const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_SECRET_KEY || '');
          if (!url.includes('lmwfhvexfcoyeuoyrlco') || !key) throw new Error('canonical_staging_credentials_unavailable');
          const db = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });

          const { data: sources, error: sourceError } = await db
            .schema('ingest').from('sources').select('id,code').eq('code', 'tcgdex').limit(1);
          if (sourceError) throw sourceError;
          const sourceId = sources?.[0]?.id;
          if (!sourceId) throw new Error('tcgdex_source_missing');

          const { data: runs, error: runError } = await db
            .schema('ingest').from('import_runs').select('id,run_key,status')
            .eq('source_id', sourceId)
            .ilike('run_key', `%${process.env.CATALOGUE_VERSION}%`);
          if (runError) throw runError;
          const runIds = (runs || []).map((row) => row.id);

          const { data: rawRows, error: rawError } = await db
            .schema('ingest').from('raw_source_records')
            .select('*')
            .eq('source_id', sourceId)
            .eq('language_code', 'en')
            .in('external_id', targetIds)
            .order('retrieved_at', { ascending: false });
          if (rawError) throw rawError;
          const rawIds = (rawRows || []).map((row) => row.id);

          let conflicts = [];
          if (runIds.length && rawIds.length) {
            const { data, error } = await db.schema('ingest').from('data_conflicts')
              .select('*')
              .in('import_run_id', runIds)
              .in('raw_record_id', rawIds)
              .order('created_at', { ascending: true });
            if (error) throw error;
            conflicts = data || [];
          }

          const externalPatterns = targetIds.flatMap((id) => [
            id,
            `${id}:normal`,
            `${id}:reverse_holo`,
            `${id}:reverse`,
            `${id}:holo`,
            `${id}:cosmos_holo`,
            `${id}:promo_holo`,
          ]);
          const { data: identifiers, error: identifierError } = await db
            .schema('ingest').from('external_identifiers')
            .select('*')
            .eq('source_id', sourceId)
            .eq('source_entity_type', 'card')
            .eq('language_code', 'en')
            .in('external_id', externalPatterns)
            .order('external_id', { ascending: true });
          if (identifierError) throw identifierError;

          const variantIds = [...new Set((identifiers || []).map((row) => row.variant_id).filter(Boolean))];
          let variants = [];
          if (variantIds.length) {
            const { data, error } = await db.schema('catalog').from('card_variants')
              .select('*')
              .in('id', variantIds)
              .order('variant_code', { ascending: true });
            if (error) throw error;
            variants = data || [];
          }

          const printingIds = [...new Set(variants.map((row) => row.printing_id).filter(Boolean))];
          let printingVariants = [];
          let printings = [];
          if (printingIds.length) {
            const variantQuery = await db.schema('catalog').from('card_variants')
              .select('*')
              .in('printing_id', printingIds)
              .order('printing_id', { ascending: true })
              .order('variant_code', { ascending: true });
            if (variantQuery.error) throw variantQuery.error;
            printingVariants = variantQuery.data || [];

            const printingQuery = await db.schema('catalog').from('card_printings')
              .select('*')
              .in('id', printingIds);
            if (printingQuery.error) throw printingQuery.error;
            printings = printingQuery.data || [];
          }

          const report = {
            schemaVersion: 2,
            diagnosedAt: new Date().toISOString(),
            projectRef: 'lmwfhvexfcoyeuoyrlco',
            version: process.env.CATALOGUE_VERSION,
            targetIds,
            readOnly: true,
            runs,
            rawRows,
            conflicts,
            identifiers,
            linkedVariants: variants,
            allPrintingVariants: printingVariants,
            printings,
          };
          writeFileSync('reports/catalogue/variant-conflict-diagnostics.json', JSON.stringify(report, null, 2) + '\n');

          const rawById = new Map((rawRows || []).map((row) => [row.id, row]));
          const variantById = new Map(variants.map((row) => [row.id, row]));
          const summaries = targetIds.map((externalId) => {
            const ids = (identifiers || []).filter((row) => row.external_id === externalId || row.external_id.startsWith(`${externalId}:`));
            const printingIdSet = new Set(ids.map((row) => variantById.get(row.variant_id)?.printing_id).filter(Boolean));
            const relatedPrintingVariants = printingVariants.filter((row) => printingIdSet.has(row.printing_id));
            return {
              externalId,
              sourceVariants: (rawRows || [])
                .filter((row) => row.external_id === externalId)
                .map((row) => row.raw_payload?.variants ?? null),
              rawPayloads: (rawRows || [])
                .filter((row) => row.external_id === externalId)
                .map((row) => ({
                  rawRecordId: row.id,
                  validationStatus: row.validation_status,
                  variants: row.raw_payload?.variants ?? null,
                  image: row.raw_payload?.image ?? null,
                  category: row.raw_payload?.category ?? null,
                  rarity: row.raw_payload?.rarity ?? null,
                  updated: row.raw_payload?.updated ?? row.raw_payload?.updatedAt ?? null,
                })),
              identifiers: ids.map((row) => {
                const variant = variantById.get(row.variant_id);
                return {
                  externalId: row.external_id,
                  current: row.is_current,
                  variantId: row.variant_id,
                  variantCode: variant?.variant_code ?? null,
                  printingId: variant?.printing_id ?? null,
                  confidence: row.confidence ?? null,
                  sourceUpdatedAt: row.source_updated_at ?? null,
                  deprecatedAt: row.deprecated_at ?? null,
                  deprecatedReason: row.deprecated_reason ?? null,
                };
              }),
              printingVariants: relatedPrintingVariants.map((row) => ({
                id: row.id,
                printingId: row.printing_id,
                variantCode: row.variant_code,
                canonicalKey: row.canonical_key ?? null,
                sourceUpdatedAt: row.source_updated_at ?? null,
                deprecatedAt: row.deprecated_at ?? null,
                deprecatedReason: row.deprecated_reason ?? null,
              })),
              conflicts: conflicts
                .filter((row) => rawById.get(row.raw_record_id)?.external_id === externalId)
                .map((row) => ({
                  id: row.id,
                  type: row.conflict_type,
                  severity: row.severity,
                  status: row.status,
                  canonicalKey: row.canonical_key ?? null,
                  notes: row.internal_notes ?? null,
                  proposed: row.proposed_payload ?? null,
                  existing: row.existing_payload ?? null,
                  resolvedAt: row.resolved_at ?? null,
                  resolutionNotes: row.resolution_notes ?? null,
                })),
            };
          });
          console.log(JSON.stringify({ summaries }));
          NODE

          summary_json="$(
            npx --yes @railway/cli@5.30.1 run \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_BACKEND_SERVICE_ID" \
              --no-local \
              env CATALOGUE_VERSION="$CATALOGUE_VERSION" \
              node "$script_path" \
              | tail -n 1
          )"
          rm -f "$script_path"
          echo "$summary_json" > reports/catalogue/variant-conflict-summary.json

          body="$(SUMMARY_JSON="$summary_json" node <<'NODE'
          const data = JSON.parse(process.env.SUMMARY_JSON);
          const sections = data.summaries.map((item) => {
            const sourceVariants = [...new Set(item.sourceVariants.map((value) => JSON.stringify(value)))].join(', ');
            const identifiers = item.identifiers.length
              ? item.identifiers.map((row) => `  - \`${row.externalId}\` → \`${row.variantCode || 'unknown'}\` (${row.current ? 'current' : `not current${row.deprecatedReason ? `: ${row.deprecatedReason}` : ''}`})`).join('\n')
              : '  - none';
            const variants = item.printingVariants.length
              ? item.printingVariants.map((row) => `  - \`${row.variantCode || 'unknown'}\` — ${row.deprecatedAt ? `deprecated${row.deprecatedReason ? `: ${row.deprecatedReason}` : ''}` : 'active'}`).join('\n')
              : '  - none';
            const conflictNotes = item.conflicts.length
              ? item.conflicts.map((row) => `  - ${row.severity}/${row.type}: ${row.notes || 'no note'}; proposed \`${JSON.stringify(row.proposed)}\`; existing \`${JSON.stringify(row.existing)}\``).join('\n')
              : '  - none';
            return [
              `#### ${item.externalId}`,
              `- Provider variants payload: \`${sourceVariants || 'not found'}\``,
              '- Current and historical identifiers:',
              identifiers,
              '- Variants on the linked printing:',
              variants,
              '- Conflicts:',
              conflictNotes,
            ].join('\n');
          }).join('\n\n');
          process.stdout.write(`### StackR variant identity diagnostics\n${sections}`);
          NODE
          )"
          gh api repos/${GITHUB_REPOSITORY}/issues/48/comments \
            --method POST \
            --field body="$body"

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackr-variant-conflict-diagnostics-${{ github.run_id }}
          path: reports/catalogue/variant-conflict-*.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
