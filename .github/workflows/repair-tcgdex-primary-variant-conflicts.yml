name: Repair StackR TCGdex Primary Variant Conflicts

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stackr-repair-tcgdex-primary-variant-conflicts
  cancel-in-progress: false

env:
  REPAIR_SOURCE_SHA: a2320cba976ea6cb50bde9afcc202f1e982ade5f
  TCGDEX_IMAGE: tcgdex/server@sha256:796afd47e430f2b537a46aa70b674efe00175ca0b03872e10fb7faeff9e10bc5
  TCGDEX_BASE_URL: http://127.0.0.1:3300/v2
  STAGING_PROJECT_REF: lmwfhvexfcoyeuoyrlco
  DO_NOT_TRACK: '1'

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 48 &&
      github.actor == 'tberridge86' &&
      github.event.comment.body == '/repair-stackr-tcgdex-primary-variant-conflicts-2026-08-19')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Announce the exact staging repair
        run: >-
          gh api repos/${{ github.repository }}/issues/48/comments
          --method POST
          --field body="Exact staging variant repair **${GITHUB_RUN_ID}** started for Bounsweet \`sv03-016\` and Steenee \`sv03-017\`. Scope is two base IDs plus explicit holo and reverse aliases; production is untouched."

      - name: Check out the pinned repair implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REPAIR_SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Confirm source identity and run regression gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIR_SOURCE_SHA"
          npm ci
          npm run test:catalogue-ingestion
          npm run typecheck:backend

      - name: Verify the Railway staging Supabase context
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          test -n "$RAILWAY_BACKEND_SERVICE_ID"
          npx --yes @railway/cli@5.30.1 run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_BACKEND_SERVICE_ID" \
            --no-local \
            node -e '
              const url = String(process.env.SUPABASE_URL || "");
              const result = {
                stagingSupabase: url.includes("lmwfhvexfcoyeuoyrlco"),
                serviceCredential: Boolean(process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_SECRET_KEY),
              };
              console.log(JSON.stringify(result));
              if (!result.stagingSupabase || !result.serviceCredential) process.exit(1);
            '

      - name: Pull and start the exact immutable TCGdex source
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TCGDEX_IMAGE"
          resolved="$(docker image inspect "$TCGDEX_IMAGE" --format '{{index .RepoDigests 0}}')"
          test "$resolved" = "$TCGDEX_IMAGE"
          docker run \
            --detach \
            --rm \
            --name stackr-tcgdex-variant-repair \
            --env MAX_WORKERS=2 \
            --env TCGCSV_USER_AGENT=StackR-catalogue-variant-repair/2.0 \
            --publish 127.0.0.1:3300:3000 \
            "$TCGDEX_IMAGE"

      - name: Verify both exact provider records
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if curl --fail --silent "$TCGDEX_BASE_URL/en/cards/sv03-016" >/dev/null \
              && curl --fail --silent "$TCGDEX_BASE_URL/en/cards/sv03-017" >/dev/null; then
              exit 0
            fi
            if [ "$attempt" = "180" ]; then
              docker logs stackr-tcgdex-variant-repair
              exit 1
            fi
            sleep 2
          done

      - name: Reconcile and verify only the two affected cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/catalogue
          npx --yes @railway/cli@5.30.1 run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_BACKEND_SERVICE_ID" \
            --no-local \
            env \
              STACKR_CATALOGUE_IMPORT_TARGET=staging \
              TCGDEX_BASE_URL="$TCGDEX_BASE_URL" \
              TCGDEX_IMAGE="$TCGDEX_IMAGE" \
              REPAIR_SOURCE_SHA="$REPAIR_SOURCE_SHA" \
              npx --no-install tsx scripts/repair-tcgdex-primary-variant-conflicts.mts

      - name: Secret-scan and upload the repair evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy/secret-scan.mjs --directory=reports/catalogue

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackr-tcgdex-primary-variant-repair-${{ github.run_id }}
          path: reports/catalogue/tcgdex-primary-variant-repair.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Stop the isolated TCGdex source
        if: always()
        run: docker stop stackr-tcgdex-variant-repair || true

      - name: Report the staging repair result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" = "success" ]; then
            body="Bounsweet \`sv03-016\` and Steenee \`sv03-017\` passed exact base/holo/reverse identity verification in staging. The two historic identity conflicts were resolved. Evidence: ${run_url}"
          else
            body="Exact TCGdex variant repair run **${GITHUB_RUN_ID}** finished with status **${JOB_STATUS}**. No production claim has been made; inspect: ${run_url}"
          fi
          gh api repos/${GITHUB_REPOSITORY}/issues/48/comments \
            --method POST \
            --field body="$body"
