name: Apply cached binder integration once

on:
  push:
    branches: [perf/binder-first-paint]
    paths: [.github/workflows/apply-binder-reopen-once.yml]

permissions:
  contents: read

concurrency:
  group: binder-reopen-integration
  cancel-in-progress: false

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply exact isolated source change
        run: |
          test "$GITHUB_REF" = 'refs/heads/perf/binder-first-paint'
          node scripts/apply-binder-reopen.mjs
      - run: npm ci
      - name: Validate source, completeness, isolation and actual loader behaviour
        run: |
          npm run typecheck
          npm run test:binder-catalogue
          npm run test:personal-loading
          node --import tsx scripts/test-binder-first-paint.mjs
          node --import tsx scripts/test-retrieval-parallel.mjs
          node --import tsx scripts/test-binder-reopen.mjs
          git diff --check
      - name: Commit tested source only, without modifying workflows or deployments
        run: |
          git rm -f -- scripts/apply-binder-reopen.mjs scripts/binder-reopen-integration.patch
          git add features/binder/BinderDetailScreen.tsx lib/performance.ts lib/binderReopenSnapshot.ts scripts/test-retrieval-parallel.mjs
          git diff --cached --check
          git diff --exit-code -- .github
          git config user.name 'stackr-performance-bot'
          git config user.email 'stackr-performance-bot@users.noreply.github.com'
          git commit -m 'Reopen complete saved binders read-only during safe ownership refresh'
          git push origin HEAD:perf/binder-first-paint
      - name: Retain exact tested source identity
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/binder-reopen-source-sha.txt
          sha256sum lib/binderReopenSnapshot.ts lib/binderReopenRuntime.ts lib/requestCache.ts lib/performance.ts features/binder/BinderDetailScreen.tsx > reports/binder-reopen-source-hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: binder-reopen-validation
          path: |
            reports/binder-reopen-tests.json
            reports/binder-reopen-source-sha.txt
            reports/binder-reopen-source-hashes.txt
            reports/binder-retrieval-regression.json
          if-no-files-found: warn
          retention-days: 14
