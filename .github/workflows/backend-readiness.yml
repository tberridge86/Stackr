name: Stackr Backend Readiness

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'gateway/**'
      - 'recognition-service/**'
      - 'scripts/backend-readiness-report.mjs'
      - 'scripts/catalogue-ingestion/**'
      - 'scripts/repair-tcgdex-language-assets.ts'
      - 'scripts/test-stackr-api-v1.mjs'
      - 'scripts/test-asset-pipeline.mjs'
      - 'scripts/test-database-migrations.mjs'
      - 'scripts/test-owned-card-membership-migration.mjs'
      - 'scripts/test-seller-inventory-batch-migration.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'gateway/package.json'
      - 'gateway/package-lock.json'
      - '.github/workflows/backend-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'gateway/**'
      - 'recognition-service/**'
      - 'scripts/backend-readiness-report.mjs'
      - 'scripts/catalogue-ingestion/**'
      - 'scripts/repair-tcgdex-language-assets.ts'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'gateway/package.json'
      - 'gateway/package-lock.json'
      - '.github/workflows/backend-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackr-backend-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependency trees
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix gateway
      - name: Produce backend readiness evidence
        run: >-
          node scripts/backend-readiness-report.mjs
          --scope=full
          --output=reports/backend/readiness.json
      - name: Upload machine-readable backend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackr-backend-readiness-${{ github.sha }}
          path: reports/backend/readiness.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  database-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify migration ordering and safety
        run: npm run test:database-migrations
      - name: Verify owned-card membership migration
        run: >-
          node scripts/test-owned-card-membership-migration.mjs
          --db-url=postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - name: Verify atomic seller inventory batches
        run: >-
          node scripts/test-seller-inventory-batch-migration.mjs
          --db-url=postgresql://postgres:postgres@127.0.0.1:5432/postgres

  recognition-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: recognition-service/requirements-dev.txt
      - name: Install recognition test dependencies
        run: python -m pip install --requirement recognition-service/requirements-dev.txt
      - name: Run recognition-service tests
        run: python -m pytest recognition-service/tests -q
      - name: Build pinned non-root recognition image
        run: docker build --pull --tag stackr-recognition:${{ github.sha }} recognition-service
      - name: Verify container user and healthcheck
        run: |
          test "$(docker image inspect stackr-recognition:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test -n "$(docker image inspect stackr-recognition:${{ github.sha }} --format '{{json .Config.Healthcheck}}')"
      - name: Exercise container health endpoint
        run: |
          docker run --detach --rm --name stackr-recognition-backend-ci -p 18080:8080 stackr-recognition:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs stackr-recognition-backend-ci
          exit 1
