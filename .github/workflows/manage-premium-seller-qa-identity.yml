name: Manage Premium Seller QA Identity

on:
  workflow_dispatch:
    inputs:
      action:
        description: QA identity lifecycle action
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - provision
          - send_magic_link
      expected_commit_sha:
        description: Exact main commit SHA this QA identity will be bound to
        required: true
        type: string
      confirmation:
        description: Type the exact confirmation phrase for the selected action
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stackr-premium-seller-qa-identity
  cancel-in-progress: false

jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_PROJECT_REF: oakdbbzdqwurpjnoqhmu
      STACKR_PREMIUM_SELLER_QA_ACTION: ${{ inputs.action }}
      STACKR_PREMIUM_SELLER_QA_CONFIRMATION: ${{ inputs.confirmation }}
      STACKR_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      STACKR_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate the exact typed request and checked-out release
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$STACKR_RELEASE_SHA"
          node scripts/deploy/manage-premium-seller-qa-identity.mjs --validate-request

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Prepare the normalized production database URL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/deploy/prepare-postgres-urls.mjs --source-only

      - name: Run the guarded QA identity action
        env:
          PREMIUM_SELLER_QA_EMAIL: ${{ secrets.PREMIUM_SELLER_QA_EMAIL }}
          STACKR_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STACKR_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_SECRET_KEY: ${{ secrets.SUPABASE_PRODUCTION_SECRET_KEY }}
        run: node scripts/deploy/manage-premium-seller-qa-identity.mjs
