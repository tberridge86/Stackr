name: Build Traditional Chinese logo sheets fast

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-v2-20260912
    paths:
      - .github/scripts/build_traditional_chinese_logo_sheets_fast.py
      - .github/workflows/build-traditional-chinese-logo-sheets-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Traditional Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Build static A4 sheets
        run: python .github/scripts/build_traditional_chinese_logo_sheets_fast.py
      - name: Upload finished sheet pack
        uses: actions/upload-artifact@v4
        with:
          name: traditional-chinese-pokemon-set-logos-fast
          path: build/traditional-chinese-logo-sheets-v2/
          if-no-files-found: error
          retention-days: 3
