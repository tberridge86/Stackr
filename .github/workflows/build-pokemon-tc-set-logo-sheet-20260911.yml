name: Build Traditional Chinese Pokemon Set Logo Sheet 20260911

on:
  push:
    branches:
      - asset/pokemon-tc-set-logo-sheet-20260911
    paths:
      - tools/build_tc_set_logo_sheet_20260911_v2.py.gz.b64
      - .github/workflows/build-pokemon-tc-set-logo-sheet-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow reportlab beautifulsoup4

      - name: Reconstruct and verify build script
        run: |
          base64 --decode tools/build_tc_set_logo_sheet_20260911_v2.py.gz.b64 \
            | gzip --decompress \
            > tools/build_tc_set_logo_sheet_20260911.py
          python -m py_compile tools/build_tc_set_logo_sheet_20260911.py

      - name: Build Traditional Chinese logo sheet and import bundle
        run: python tools/build_tc_set_logo_sheet_20260911.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-tc-set-logo-sheet-6-per-page-${{ github.run_id }}
          path: artifacts/pokemon-tc-set-logo-sheet-20260911/
          if-no-files-found: error
          retention-days: 14

# V2 adds exact-code Japanese original-set wordmarks when Traditional Chinese assets do not exist.
