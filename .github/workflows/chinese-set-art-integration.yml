name: Chinese set-art integration
on:
  push:
    branches: [agent/catalogue/chinese-set-art-integration-20260912]
    paths: [.github/workflows/chinese-set-art-integration.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: tc-published-logo-recovery-v3
          run-id: 34701428806
          github-token: ${{ github.token }}
          path: tc-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.5 Pillow==11.3.0
      - run: python -u scripts/catalogue-chinese-logo-evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chinese-logo-evidence
          path: chinese-logo-evidence/
          retention-days: 7
          if-no-files-found: error
