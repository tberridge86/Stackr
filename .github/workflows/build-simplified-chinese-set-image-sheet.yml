name: Audit Simplified Chinese set logos
on:
  push:
    branches:
      - artifacts/simplified-chinese-set-logos-20260911
    paths:
      - .github/workflows/build-simplified-chinese-set-image-sheet.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install tools
        run: python -m pip install requests pillow
      - name: Retrieve logo files
        run: |
          python - <<'PY'
          import hashlib,io,json
          from pathlib import Path
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor
          import requests
          from PIL import Image
          out=Path('logos');out.mkdir()
          names=[c+' Logo SC.png' for c in ['CSV1','CSV2','CSV3','CSV4','CSV5','CSV6','CSV7','CSV8','CSV9','CSV9.5','CSV10','CS1','CS1.5','CS2','CS2.5','CS3','CS3.5','CS4','CS4.5','CS5','CS5.5','CS6','CS6.5','CSM1.5','CSM2','CSM2.5']]
          names+=['CSM1 Logo A SC.png','CSM1 Logo B SC.png','CSM2 Logo A SC.png','CSM2 Logo B SC.png','CBB1 Logo.png','CBB2 Logo.png','CBB3 Logo.png','CBB4 Logo.png','CBB5 Logo.png','CSVH3 Happy Deck logo.png','CSVH3 Happy Set logo.png','CSVM logo.png']
          def run(name):
              f=name.replace(' ','_');h=hashlib.md5(f.encode()).hexdigest();base='https://archives.bulbagarden.net/media/upload/'+h[0]+'/'+h[:2]+'/'+quote(f)
              urls=[base,'https://archives.bulbagarden.net/media/upload/thumb/'+h[0]+'/'+h[:2]+'/'+quote(f)+'/600px-'+quote(f),'https://bulbapedia.bulbagarden.net/wiki/Special:FilePath/'+quote(f)]
              rec={'filename':f,'status':'not_retrieved','attempts':[]}
              for u in urls:
                  try:
                      r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://bulbapedia.bulbagarden.net/'},timeout=10)
                      rec['attempts'].append({'url':u,'status':r.status_code,'type':r.headers.get('content-type'),'preview':r.text[:120] if not r.headers.get('content-type','').startswith('image/') else ''})
                      if r.status_code!=200:continue
                      im=Image.open(io.BytesIO(r.content));im.load()
                      if im.format!='PNG':continue
                      (out/f).write_bytes(r.content);rec.update(status='candidate_only',url=r.url,width=im.width,height=im.height,sha256=hashlib.sha256(r.content).hexdigest());break
                  except Exception as e:rec['attempts'].append({'error':str(e)[:200]})
              return rec
          with ThreadPoolExecutor(max_workers=5) as p:rows=list(p.map(run,names))
          (out/'audit.json').write_text(json.dumps(rows,indent=2));print(json.dumps(rows[:2],indent=2));print('retrieved',sum(x['status']=='candidate_only' for x in rows))
          PY
      - name: Upload bounded audit
        uses: actions/upload-artifact@v4
        with:
          name: simplified-chinese-logo-access-audit
          path: logos/
          retention-days: 14
