name: Audit Simplified Chinese set logos
on:
  push:
    branches: [artifacts/simplified-chinese-set-logos-20260911]
    paths: [.github/workflows/build-simplified-chinese-set-image-sheet.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install tools
        run: python -m pip install requests pillow beautifulsoup4
      - name: Retrieve independently hosted named logo candidates
        run: |
          python - <<'PY'
          import io,json,re,hashlib
          from pathlib import Path
          from urllib.parse import urljoin,urlparse,parse_qs
          from concurrent.futures import ThreadPoolExecutor
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          out=Path('assets');out.mkdir()
          H={'User-Agent':'Mozilla/5.0'}
          def get(u):
              r=requests.get(u,headers=H,timeout=15);r.raise_for_status();return r
          pages={'https://mtcg.pl/pokemon-cn/chasing-glory-together'}
          for u in ['https://mtcg.pl/pokemon-cn','https://mtcg.pl/pokemon-cn/chasing-glory-together']:
              try:
                  r=get(u);s=BeautifulSoup(r.content,'html.parser')
                  (out/('index_'+hashlib.sha1(u.encode()).hexdigest()[:8]+'.html')).write_text(r.text)
                  for a in s.find_all('a',href=True):
                      v=urljoin(u,a['href'])
                      if re.match(r'^https://mtcg.pl/pokemon-cn/[a-z0-9-]+$',v):pages.add(v)
              except Exception as e: print(u,str(e)[:180],flush=True)
          def page(u):
              result=[];slug=u.rsplit('/',1)[-1]
              try:
                  r=get(u);s=BeautifulSoup(r.content,'html.parser');(out/(slug+'.html')).write_text(r.text)
                  for i,tag in enumerate(s.find_all('img')):
                      alt=str(tag.get('alt',''));src=tag.get('src','') or tag.get('data-src','')
                      if 'logo' not in alt.lower() or not src:continue
                      v=urljoin(u,src)
                      if 'mtcg' in alt.lower() and 'logo' in alt.lower():continue
                      try:
                          b=get(v).content;im=Image.open(io.BytesIO(b));im.load()
                          fn=f'{slug}_{i}.png';im.save(out/fn)
                          result.append({'page_url':u,'image_url':v,'alt':alt,'file':fn,'width':im.width,'height':im.height,'mode':im.mode})
                      except Exception as e:result.append({'page_url':u,'image_url':v,'alt':alt,'error':str(e)[:160]})
              except Exception as e:result.append({'page_url':u,'error':str(e)[:160]})
              return result
          with ThreadPoolExecutor(max_workers=5) as p:rows=[r for b in p.map(page,sorted(pages)[:75]) for r in b]
          (out/'manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2));print('pages',len(pages),'images',sum('file' in x for x in rows),flush=True)
          PY
      - name: Upload candidates and evidence
        uses: actions/upload-artifact@v4
        with:
          name: simplified-chinese-independent-logo-candidates
          path: assets/
          retention-days: 14
