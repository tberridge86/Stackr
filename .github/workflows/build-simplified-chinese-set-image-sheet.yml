name: Build Simplified Chinese set image sheet
on:
  push:
    branches:
      - artifacts/simplified-chinese-set-logos-20260911
    paths:
      - .github/workflows/build-simplified-chinese-set-image-sheet.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recover compact manifest
        uses: actions/download-artifact@v4
        with:
          name: simplified-chinese-compact-recovery
          run-id: 34675677316
          github-token: ${{ github.token }}
          path: previous
      - name: Install image tools
        run: python -m pip install pillow requests beautifulsoup4
      - name: Retrieve product candidates and normalized set art
        run: |
          python - <<'PY'
          import csv, io, json, re
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from PIL import Image,ImageOps
          import requests
          out=Path('enrichment');out.mkdir(); rows=list(csv.DictReader(open('previous/retrieval_report.csv',encoding='utf-8-sig')))
          targets=[20828,19759,19640,15625,15885,15806,15840,15831,15882,15955,15928,15951,16282,16031,16070,16139,16348,16363,16365,15584,15688,15977,16368,22630,21022,15447,15514,15585,15683,15824]
          def article(aid):
              url=f'https://www.pokemon.cn/tcg/product/{aid}.html'; results=[]
              try:
                  r=requests.get(url,timeout=25);r.raise_for_status();s=BeautifulSoup(r.content,'html.parser')
                  (out/f'article_{aid}.txt').write_text(s.get_text(' ',strip=True),encoding='utf-8')
                  (out/f'article_{aid}.html').write_text(r.text,encoding='utf-8')
                  seen=set()
                  for img in s.find_all('img'):
                      u=next((img.get(k) for k in ['data-src','data-original','src'] if img.get(k) and not img.get(k).startswith('data:')),'')
                      u=urljoin(url,u)
                      if '/wp-content/uploads/' not in u or u in seen: continue
                      seen.add(u)
                      if len(seen)>70: break
                      prev=img.find_previous(['p','h2','h3','h4']);nxt=img.find_next(['p','h2','h3','h4'])
                      results.append({'article_id':aid,'article_url':url,'ordinal':len(seen),'url':u,'context':((prev.get_text(' ',strip=True) if prev else '')+' | '+(nxt.get_text(' ',strip=True) if nxt else ''))[:600]})
              except Exception as e: print('article error',aid,type(e).__name__)
              return results
          with ThreadPoolExecutor(max_workers=6) as pool: batches=list(pool.map(article,targets))
          candidates=[c for b in batches for c in b]
          for r in rows:
              code=r['requested_code']
              if '.' in code:
                  candidates.append({'code':code,'url':f"https://grokachu.fr/media/tcg/{code.replace('.','-')}/images/sets/{code}.webp",'article_id':'catalogue','ordinal':code})
          def download(c):
              try:
                  r=requests.get(c['url'],timeout=18);r.raise_for_status();im=ImageOps.exif_transpose(Image.open(io.BytesIO(r.content))).convert('RGBA');im.thumbnail((1100,1100),Image.Resampling.LANCZOS)
                  bg=Image.new('RGB',im.size,'white');bg.paste(im,mask=im.getchannel('A'))
                  fn=f"{c['article_id']}_{c['ordinal']}.jpg";bg.save(out/fn,quality=91,optimize=True)
                  c.update(status='retrieved',local_file=fn,width=im.width,height=im.height)
              except Exception as e:c.update(status='missing',error=type(e).__name__)
              return c
          with ThreadPoolExecutor(max_workers=10) as pool: result=list(pool.map(download,candidates))
          (out/'candidate_manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Downloaded',sum(c['status']=='retrieved' for c in result),'of',len(result))
          PY
      - name: Upload product candidates
        uses: actions/upload-artifact@v4
        with:
          name: simplified-chinese-product-candidates
          path: enrichment/
          if-no-files-found: error
          retention-days: 14
