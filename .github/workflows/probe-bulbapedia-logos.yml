name: Probe Bulbapedia Japanese set logos

on:
  push:
    branches:
      - artifact/traditional-chinese-logos-a4-v2
    paths:
      - .github/scripts/probe_bulbapedia_logos.py
      - .github/workflows/probe-bulbapedia-logos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python .github/scripts/probe_bulbapedia_logos.py
      - uses: actions/upload-artifact@v4
        with:
          name: bulbapedia-logo-probe
          path: build/bulbapedia-logo-probe/
          if-no-files-found: error
          retention-days: 3
