name: Build Stackr Staging APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-staging-apk.yml

permissions:
  contents: read

concurrency:
  group: stackr-staging-apk
  cancel-in-progress: false

jobs:
  build-staging-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Attest exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frozen release controls
        run: |
          npm run deploy:verify-baseline
          npm run deploy:verify-release-candidate
          npm run test:mobile-runtime-config

      - name: Verify isolated staging APK configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { appendFileSync } = require('node:fs');
          const app = require('./app.json').expo;
          const configureApp = require('./app.config.js');
          const eas = require('./eas.json');

          const profile = eas.build?.staging;
          assert.equal(profile?.distribution, 'internal');
          assert.equal(profile?.channel, 'staging');
          assert.equal(profile?.android?.buildType, 'apk');
          assert.equal(profile?.env?.STACKR_MOBILE_APP_VARIANT, 'staging');
          assert.equal(profile?.env?.STACKR_MOBILE_ENVIRONMENT, 'staging');
          assert.equal(profile?.env?.EXPO_PUBLIC_PREMIUM_SELLER_MODE_ENABLED, 'false');

          Object.assign(process.env, profile.env);
          const resolved = configureApp({ config: app });

          assert.equal(resolved.name, 'Stackr Staging');
          assert.equal(resolved.android?.package, 'com.tommo86.Stackr.staging');
          assert.equal(resolved.runtimeVersion, '1.0.3-staging');

          for (const [key, value] of Object.entries(profile.env)) {
            assert.match(key, /^[A-Z][A-Z0-9_]*$/u);
            assert.equal(typeof value, 'string');
            assert.doesNotMatch(value, /[\r\n]/u);
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          appendFileSync(process.env.GITHUB_ENV, 'STACKR_EXPECTED_RUNTIME_VERSION=1.0.3-staging\n');
          appendFileSync(process.env.GITHUB_ENV, 'STACKR_EXPECTED_ANDROID_PACKAGE=com.tommo86.Stackr.staging\n');
          NODE

      - name: Generate isolated native staging project
        shell: bash
        run: |
          set -euo pipefail
          test ! -e android
          CI=1 npx expo prebuild --platform android --no-install

          node <<'NODE'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { AndroidConfig } = require('@expo/config-plugins');
          const { setUpdatesConfigAsync } = require('@expo/config-plugins/build/android/Updates');

          const projectRoot = process.cwd();
          const config = require('./app.config.js')({ config: require('./app.json').expo });
          assert.equal(config.runtimeVersion, '1.0.3-staging');
          config.updates = {
            ...(config.updates ?? {}),
            requestHeaders: {
              ...(config.updates?.requestHeaders ?? {}),
              'expo-channel-name': 'staging',
            },
          };

          const manifestPath = path.join(projectRoot, 'android/app/src/main/AndroidManifest.xml');
          (async () => {
            const manifest = await AndroidConfig.Manifest.readAndroidManifestAsync(manifestPath);
            const updated = await setUpdatesConfigAsync(
              projectRoot,
              config,
              manifest,
              require('expo-updates/package.json').version,
            );
            await AndroidConfig.Manifest.writeAndroidManifestAsync(manifestPath, updated);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          grep -F 'com.tommo86.Stackr.staging' android/app/build.gradle
          grep -F '<string name="expo_runtime_version">1.0.3-staging</string>' \
            android/app/src/main/res/values/strings.xml
          grep -F 'expo.modules.updates.UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY' \
            android/app/src/main/AndroidManifest.xml
          grep -F 'expo-channel-name' android/app/src/main/AndroidManifest.xml

      - name: Build pinned staging APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x android/gradlew
          (
            cd android
            ./gradlew --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" \
              :app:assembleRelease
          )

      - name: Validate and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/stackr-staging-apk"
          apk_filename="stackr-staging-${GITHUB_SHA}.apk"
          apk_path="$artifact_dir/$apk_filename"
          mkdir -p "$artifact_dir"
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          install -m 0644 "$source_apk" "$apk_path"
          test -s "$apk_path"
          unzip -tq "$apk_path"

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 \
            -type d -print | sort -V | tail -n 1)"
          test -n "$build_tools_dir"
          test -x "$build_tools_dir/aapt"
          test -x "$build_tools_dir/apksigner"
          test -x "$build_tools_dir/zipalign"
          "$build_tools_dir/aapt" dump badging "$apk_path" > "$RUNNER_TEMP/staging-apk-badging.txt"
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$apk_path" \
            > "$RUNNER_TEMP/staging-apk-signature.txt"
          "$build_tools_dir/zipalign" -c -P 16 4 "$apk_path"

          node <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const badging = readFileSync(`${process.env.RUNNER_TEMP}/staging-apk-badging.txt`, 'utf8');
          const packageLine = badging.split(/\r?\n/u).find((line) => line.startsWith('package:')) ?? '';
          assert.match(packageLine, /name='com\.tommo86\.Stackr\.staging'/u);
          assert.match(packageLine, /versionCode='8'/u);
          assert.match(packageLine, /versionName='1\.0\.3'/u);

          const signature = readFileSync(`${process.env.RUNNER_TEMP}/staging-apk-signature.txt`, 'utf8');
          assert.match(signature, /Signer #1 certificate SHA-256 digest:\s*[0-9a-f]{64}/iu);
          NODE

          (
            cd "$artifact_dir"
            sha256sum "$apk_filename" > stackr-staging.apk.sha256
          )

          {
            echo "STACKR_APK_PATH=$apk_path"
            echo "STACKR_APK_FILENAME=$apk_filename"
          } >> "$GITHUB_ENV"

      - name: Write non-secret build evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, statSync, writeFileSync } = require('node:fs');
          const path = require('node:path');
          const artifactDir = path.dirname(process.env.STACKR_APK_PATH);
          const checksum = readFileSync(
            path.join(artifactDir, 'stackr-staging.apk.sha256'),
            'utf8',
          ).trim().split(/\s+/u)[0];
          if (!/^[0-9a-f]{64}$/u.test(checksum)) throw new Error('staging_apk_sha256_invalid');
          const signature = readFileSync(
            `${process.env.RUNNER_TEMP}/staging-apk-signature.txt`,
            'utf8',
          );
          const certificateSha256 = signature.match(
            /Signer #1 certificate SHA-256 digest:\s*([0-9a-f]{64})/iu,
          )?.[1]?.toLowerCase();
          if (!certificateSha256) throw new Error('staging_apk_certificate_sha256_invalid');

          const evidence = {
            schemaVersion: 'stackr-staging-apk-evidence-v1.0.0',
            candidateId: 'stackr-1.0.3-rc.0',
            repository: process.env.GITHUB_REPOSITORY,
            source: {
              buildCommit: process.env.GITHUB_SHA,
              frozenCandidateCommit: 'd80b0f82843710c7eb942f1e97533ea0af77447c',
            },
            workflow: {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            },
            build: {
              provider: 'github_actions_local_android',
              profile: 'staging',
              gradleTask: ':app:assembleRelease',
              channel: 'staging',
              runtimeVersion: process.env.STACKR_EXPECTED_RUNTIME_VERSION,
              completedAt: new Date().toISOString(),
              signing: 'expo_generated_debug_keystore_internal_staging_only',
              signingCertificateSha256: certificateSha256,
            },
            apk: {
              filename: process.env.STACKR_APK_FILENAME,
              bytes: statSync(process.env.STACKR_APK_PATH).size,
              sha256: checksum,
              androidPackage: 'com.tommo86.Stackr.staging',
            },
          };
          writeFileSync(
            path.join(artifactDir, 'staging-apk-evidence.json'),
            `${JSON.stringify(evidence, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE

      - name: Upload staging APK and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackr-staging-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/stackr-staging-apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
