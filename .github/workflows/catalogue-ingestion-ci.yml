name: Catalogue Ingestion CI

on:
  workflow_dispatch:
    inputs:
      language:
        description: TCGdex language batch
        required: true
        default: en
        type: choice
        options: [en, ja, zh-tw, zh-cn, ko]
      offset:
        description: Zero-based provider card offset
        required: true
        default: '0'
        type: string
      limit:
        description: Provider cards in this batch (maximum 500)
        required: true
        default: '250'
        type: string
      batches:
        description: Consecutive batches to run (maximum 12)
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: stackr-staging-catalogue-${{ inputs.language }}
  cancel-in-progress: false

jobs:
  ingest-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    env:
      SUPABASE_URL: https://lmwfhvexfcoyeuoyrlco.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      STACKR_CATALOGUE_IMPORT_TARGET: staging
      CATALOGUE_LANGUAGE: ${{ inputs.language }}
      CATALOGUE_START_OFFSET: ${{ inputs.offset }}
      CATALOGUE_BATCH_LIMIT: ${{ inputs.limit }}
      CATALOGUE_BATCH_COUNT: ${{ inputs.batches }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate bounded batch inputs
        shell: bash
        run: |
          [[ "$CATALOGUE_START_OFFSET" =~ ^[0-9]+$ ]] || exit 1
          [[ "$CATALOGUE_BATCH_LIMIT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$CATALOGUE_BATCH_COUNT" =~ ^[0-9]+$ ]] || exit 1
          (( CATALOGUE_BATCH_LIMIT >= 1 && CATALOGUE_BATCH_LIMIT <= 500 )) || exit 1
          (( CATALOGUE_BATCH_COUNT >= 1 && CATALOGUE_BATCH_COUNT <= 12 )) || exit 1
      - name: Import bounded staging metadata range
        shell: bash
        run: |
          for (( batch=0; batch<CATALOGUE_BATCH_COUNT; batch++ )); do
            current_offset=$((CATALOGUE_START_OFFSET + batch * CATALOGUE_BATCH_LIMIT))
            npm run catalogue:ingest -- run-language \
              --source=tcgdex \
              --language="$CATALOGUE_LANGUAGE" \
              --offset="$current_offset" \
              --limit="$CATALOGUE_BATCH_LIMIT" \
              --writeConcurrency=8 \
              --runKey="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${batch}" \
              --target=staging
          done
      - name: Report language quality
        run: >-
          npm run catalogue:ingest -- quality-report
          --language="${{ inputs.language }}"
          --limit=500
