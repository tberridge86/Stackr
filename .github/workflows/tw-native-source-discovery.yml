name: TW official artwork bounded discovery
on:
  push:
    branches: ['artwork/tw-sv4a-sv2a-20260926']
    paths: ['.github/workflows/tw-native-source-discovery.yml']
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect exact public sources with no database credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,shutil,re
          from pathlib import Path
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.parse import urlsplit,urljoin
          root=Path('tw-native-discovery');root.mkdir()
          allow={'assets.tcgdex.net','asia.pokemon-card.com'}
          class SafeRedirect(HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,url):
              if urlsplit(url).scheme!='https' or urlsplit(url).hostname not in allow:raise ValueError('Redirect rejected')
              return super().redirect_request(req,fp,code,msg,headers,url)
          report=[]
          def get(u,name):
            try:
              if urlsplit(u).hostname not in allow:raise ValueError('Host rejected')
              with build_opener(SafeRedirect()).open(Request(u,headers={'User-Agent':'StackrArtworkAudit/1.0','Cache-Control':'no-cache'}),timeout=18) as r:
                b=r.read(5000001)
                if len(b)>5000000:raise ValueError('Response cap')
                (root/name).write_bytes(b);x={'url':u,'file':name,'status':r.status,'bytes':len(b),'mime':r.headers.get_content_type()}
                report.append(x);print(json.dumps(x),flush=True);time.sleep(0.75);return b
            except Exception as e:
              x={'url':u,'file':name,'error':str(e)};report.append(x);print(json.dumps(x),flush=True);return None
          for c in ['SV4a','SV2a']:
            get('https://assets.tcgdex.net/zh-tw/SV/'+c+'/021/high.webp',c+'-021.webp')
            b=get('https://asia.pokemon-card.com/tw/card-search/list/?expansionCodes='+c,c+'-list.html')
            if b:
              links=list(dict.fromkeys(re.findall(r'href="([^"#]*card-search/detail/[^"#]+)"',b.decode('utf-8'))))
              print('DETAIL_LINKS',c,links[:3],flush=True)
              if links:get(urljoin('https://asia.pokemon-card.com',links[0]),c+'-detail.html')
          get('https://asia.pokemon-card.com/robots.txt','robots.txt')
          get('https://asia.pokemon-card.com/tw/terms/','terms.html')
          for p in Path('.github/workflows').glob('*'):
            if p.is_file() and p.suffix in ['.yml','.yaml']:
              dest=root/'workflows'/p.name;dest.parent.mkdir(exist_ok=True);shutil.copyfile(p,dest)
          (root/'report.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tw-native-discovery-${{ github.run_id }}
          path: tw-native-discovery
          retention-days: 7
          if-no-files-found: error
