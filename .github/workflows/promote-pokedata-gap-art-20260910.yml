name: Promote Verified PokeData Gap Art (82)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character reviewed main SHA
        required: true
        type: string
      apply:
        description: Copy the fixed 82-asset manifest after a successful dry run
        required: true
        default: false
        type: boolean
      confirmation:
        description: Required only for apply: PROMOTE 82 VERIFIED POKEDATA ART
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stackr-production-pokedata-gap-art-20260910
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      SUPABASE_RESTORE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_STAGING_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      SUPABASE_PRODUCTION_SECRET_KEY: ${{ secrets.SUPABASE_PRODUCTION_SECRET_KEY }}
      SUPABASE_PROJECT_REF: lmwfhvexfcoyeuoyrlco
      SUPABASE_RESTORE_PROJECT_REF: oakdbbzdqwurpjnoqhmu
      STACKR_POKEDATA_GAP_MANIFEST: deploy/manifests/pokedata-gap-art-20260910.json
      STACKR_POKEDATA_GAP_APPLY: ${{ inputs.apply }}
      STACKR_POKEDATA_GAP_CONFIRMATION: ${{ inputs.confirmation }}
      STACKR_POKEDATA_GAP_EVIDENCE_PATH: ${{ runner.temp }}/pokedata-gap-art-20260910/evidence.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Attest fixed reviewed revision and invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "${{ inputs.expected_main_sha }}"
          [[ "${{ inputs.expected_main_sha }}" =~ ^[0-9a-f]{40}$ ]]
          if [ "${{ inputs.apply }}" = true ]; then test "${{ inputs.confirmation }}" = 'PROMOTE 82 VERIFIED POKEDATA ART'; else test -z "${{ inputs.confirmation }}"; fi
      - run: npm ci
      - name: Prepare protected database URLs
        run: node scripts/deploy/prepare-postgres-urls.mjs
      - name: Dry-run or apply the immutable 82-card promotion
        run: node scripts/deploy/promote-pokedata-gap-art-20260910.mjs
      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackr-pokedata-gap-art-20260910-${{ github.run_id }}
          path: ${{ runner.temp }}/pokedata-gap-art-20260910/evidence.json
          if-no-files-found: warn
          retention-days: 90
