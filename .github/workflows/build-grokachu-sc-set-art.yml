name: Build dedicated Simplified Chinese set art

on:
  push:
    branches:
      - artifacts/sc-set-image-retry-20260911
    paths:
      - artifact-jobs/simplified-chinese-set-logos/grokachu_set_art_builder.py
      - .github/workflows/build-grokachu-sc-set-art.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow reportlab beautifulsoup4
      - name: Retrieve dedicated set artwork
        working-directory: artifact-jobs/simplified-chinese-set-logos
        run: python grokachu_set_art_builder.py
      - uses: actions/upload-artifact@v4
        with:
          name: simplified-chinese-dedicated-set-art
          path: artifact-jobs/simplified-chinese-set-logos/grokachu-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 8
