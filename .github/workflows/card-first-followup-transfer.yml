name: Transfer validated card-first follow-up
on:
  push:
    branches: [agent/release/card-first-browse-ui]
    paths: ['.github/workflows/card-first-followup-transfer.yml']
permissions:
  contents: write
concurrency:
  group: card-first-followup-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'tberridge86/Stackr' && github.ref == 'refs/heads/agent/release/card-first-browse-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python scripts/.card-first-followup-transfer.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-card-first-ui.cjs && node scripts/test-card-first-followup.cjs
      - run: npm run test:home-release && npm run test:binder-catalogue && npm run test:personal-loading
      - name: Fast-forward only the candidate branch after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/agent/release/card-first-browse-ui
