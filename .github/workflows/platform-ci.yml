name: Stackr Platform CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackr-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate-gate:
    # WP32 remains an explicit, separately-invoked no-go assessment. It must not
    # block unrelated mobile release maintenance after the frozen candidate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm run deploy:verify-release-candidate
      - run: npm run test:wp32-release-candidate

  lint-type-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - run: node scripts/test-chinese-membership-repair.mjs
      - run: node scripts/test-staging-binder-ownership.mjs
      - run: node tools/release-api-acceptance-20260929/migration.test.mjs
      - run: node tools/card-detail-front-20260927/migration.test.mjs
      - run: node --test tools/artwork3303-publish-20260928/publish.test.mjs tools/tw200-publish-20260930/publish.test.mjs tools/tw200-publish-20260930/workflow.test.mjs tools/english45-publish-20260930/publish.test.mjs tools/sh33-publish-20260930/publish.test.mjs tools/sh33-publish-20260930/repair.test.mjs tools/residual146-publish-20260930/publish.test.mjs tools/native96-publish-20260930/publish.test.mjs tools/korean232-publish-20260930/publish.test.mjs tools/artwork3303-publish-20260928/native-name-corrections.test.mjs tools/native65-publish-20261001/publish.test.mjs tools/native72-publish-20261001/publish.test.mjs tools/native70-publish-20261001/publish.test.mjs tools/native78-publish-20261001/publish.test.mjs tools/native73-publish-20261001/publish.test.mjs tools/native84-publish-20261001/publish.test.mjs tools/native99-publish-20261001/publish.test.mjs tools/native97-publish-20261001/publish.test.mjs tools/artwork3303-publish-20260928/journal.integration.test.mjs
      - run: node --test tools/queue1-publish-20260927/publish.test.mjs tools/queue1-pbl-relink-20260927/relink.test.mjs tools/mep89-publish-20260927/publish.test.mjs tools/pocket131-publish-20260927/publish.test.mjs tools/newsets480-publish-20260927/publish.test.mjs tools/anniversary201-publish-20260927/publish.test.mjs tools/printing-front-api-20260927/publish.test.mjs tools/card-detail-front-20260927/publish.test.mjs
      - run: node tools/pbl-price-identities-20260927/repair.test.mjs
      - run: node scripts/test-price-guard-rehearsal-workflow.mjs
      - run: node scripts/test-staging-pricing-backup-list.mjs
      - run: npm run test:price-database-deadline
      - run: npm run test:daily-pricing
      - run: node scripts/test-cardmarket-db-reviewed-ledger.mjs
      - run: node scripts/test-bounded-provider-identity-guards.mjs
      - run: node scripts/test-cardmarket-ledger-ordered-candidate.mjs
      - run: npm run test:next-beta-fixes
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:traditional-chinese-hires-logos
      - run: npm run typecheck:backend
      - run: npm run test:pokedex-release
      - run: npm run test:catalogue-price-baseline
      - run: npm run test:mobile-recovery
      - run: npm run test:server-delivery
      - run: npm test --prefix backend
      - run: npm run test:live-pricing
      - run: npm run test:personal-pricing
      - run: node scripts/test-prepare-personal-pricing.mjs
      - run: node scripts/test-gateway-privacy-smoke.mjs
      - run: node scripts/test-gateway-privacy-deployment.mjs
      - run: npm run test:collection-pricing-ui
      - run: npm run test:home-release
      - run: npm run test:home-activity
      - run: npm run test:settings-help
      - run: npm run test:ux-p1
      - run: npm run test:ux-p2
      - run: npm run test:ux-p3
      - run: npm run test:ux-audit-fixes
      - run: npm run test:poketrace-benchmark
      - run: npm run test:seller-stock-out-routing
      - run: npm run test:premium-seller-access
      - run: npm run test:commerce-release-lock
      - run: npm run test:ux-service-release
      - run: npm run test:personal-loading
      - run: npm run test:feedback-recovery
      - run: npm run test:storm-logo-publication
      - run: npm run test:binder-retrieval
      - run: npm run test:startup-loading
      - run: npm run test:integration-repair
      - run: npm run test:mobile-runtime-config
      - run: npm run test:iphone-preview
      - run: npm run test:stackr-preview-proxy
      - run: npm run test:asset-pipeline
      - run: npm run test:asset-repair
      - run: npm run test:foreign-artwork-delivery
      - run: node scripts/test-simplified-chinese-set-logo-pack.mjs
      - run: node --import tsx scripts/test-japanese-set-logo-runtime-lookup.ts
      - run: npm run test:recognition-orchestrator
      - run: npm run test:owner-recognition
      - run: npm run test:owner-teaching
      - run: npm run test:card-inspection
      - run: npm run test:scanner-calibration
      - run: npm run test:scanner-pipeline
      - run: npm run test:scanner-analytics
      - run: npm run test:mobile-scanner-routing
      - run: npm run test:scan-auto-capture
      - run: npm run test:scan-quality
      - run: npm run test:local-ocr-card-matcher
      - run: npm run test:binder-page-scan
      - run: node --import tsx scripts/test-binder-page-save-confirmation.ts
      - run: npm run test:binder-catalogue
      - run: npm run test:english-set-visibility
      - run: node --import ./scripts/enable-node-tooling-runtime.mjs --import tsx scripts/test-tcgdex-boundary-compatibility.ts
      - run: npm run test:tcgdex-controlled-card-reference
      - run: npm run test:tcgdex-reference-persistence
      - run: node --import ./scripts/enable-node-tooling-runtime.mjs --import tsx scripts/test-edition-aware-image-selection.ts
      - run: npm run test:binder-foreign-set-picker
      - run: npm run test:pokemon-language-flags
      - run: npm run test:magazine-set-covers
      - run: npm run test:corocoro-binder
      - run: node --import ./scripts/enable-node-tooling-runtime.mjs --import tsx scripts/test-binder-add-cards-metadata-persistence.ts
      - run: npm run test:card-vision-native-config
      - run: npm run test:card-localisation
      - run: npm run test:capture-geometry
      - run: npm run test:card-centering
      - run: npm run test:card-frame-analyser
      - run: npm run test:live-card-guidance
      - run: npm run test:card-rectification
      - run: npm run test:ocr-evidence
      - run: npm run test:variant-resolver
      - run: npm run test:catalogue-schema
      - run: npm run test:catalogue-ingestion
      - run: npm run test:pokedata-japanese-images
      - run: npm run test:master-catalogue-importer
      - run: npm run test:catalogue-gap-report
      - run: npm run test:four-language-catalogue-backfill
      - run: npm run test:four-language-progress
      - run: npx tsx scripts/test-stackr-quality-evaluation.ts

  distributed-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        id: dependencies
        run: |
          npm ci
          npm ci --prefix backend
      - name: Validate R2 immutability and delivery
        id: r2_storage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/test-r2-asset-delivery.mjs && node scripts/test-r2-catalogue-migration.mjs && node scripts/test-r2-catalogue-migration-cli.mjs && node scripts/test-r2-catalogue-rollback.mjs && node scripts/test-r2-migration-runner.mjs && node scripts/test-r2-migration-provision.mjs && node scripts/test-r2-stopped-migration-reconciliation.mjs && node scripts/test-r2-stopped-run-inspection.mjs && node scripts/test-r2-parallel-migration.mjs && node scripts/test-r2-bulk-run-inspection.mjs
      - name: Validate actual v1 image responses
        id: api_delivery
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/test-r2-api-delivery.mjs && node scripts/test-r2-fast-set-delivery.mjs
      - name: Validate complete bounded client pages
        id: pagination
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --import tsx scripts/test-ui-pagination.ts
      - name: Validate owned-card facts without artwork dependencies
        id: owned_facts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --import tsx scripts/test-owned-card-facts-only.ts
      - name: Validate legacy original preservation
        id: legacy_repair
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/test-stored-catalogue-asset-repair.mjs
      - name: Validate web image loading
        id: web_images
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/test-stackr-image-web.cjs
      - name: Validate Railway worker activation boundaries
        id: worker_boundary
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/test-railway-catalogue-price-worker.mjs
      - name: Validate retrieval acceptance probe
        id: retrieval_probe
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test scripts/test-retrieval-acceptance.mjs
      - name: Validate evidence reporting
        id: report_contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/test-architecture-validation-report.mjs
      - name: Build and inspect the isolated R2 migration worker
        id: migration_image
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          docker build --tag stackr-r2-migration:test --file deploy/catalogue-r2-migration/Dockerfile .
          docker run --rm stackr-r2-migration:test
          docker run --rm stackr-r2-migration:test node scripts/run-r2-catalogue-migration.mjs
          docker run --rm stackr-r2-migration:test node --input-type=module -e "import './scripts/migrate-catalogue-to-r2.mjs'; import './scripts/inspect-r2-stopped-run.mjs'; import './scripts/inspect-r2-bulk-run.mjs'; import { loadPinnedSupabaseRootCertificate } from './scripts/deploy/verified-supabase-postgres.mjs'; loadPinnedSupabaseRootCertificate(); console.log('Migration imports and pinned certificate verified.');"
      - name: Record tested source and all check outcomes
        if: ${{ always() }}
        env:
          ARCHITECTURE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARCHITECTURE_STEPS_JSON: ${{ toJSON(steps) }}
          ARCHITECTURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/architecture-validation-report.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: distributed-architecture-validation
          path: reports/distributed-architecture-validation.json
          if-no-files-found: error
          retention-days: 14

  database-migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stackr_live_pricing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:database-migrations
      - run: npm run test:asset-manifest-query-equivalence
      - run: node scripts/test-prepare-binder-artwork-read.mjs
      - run: >-
          node scripts/test-owned-card-membership-migration.mjs
          --db-url=postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: >-
          node scripts/test-seller-inventory-batch-migration.mjs
          --db-url=postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: >-
          node tools/newsets480-publish-20260927/migration.test.mjs
          --db-url=postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: >-
          node tools/printing-front-api-20260927/migration.test.mjs
          --db-url=postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - name: Start and reset local Supabase
        if: vars.SUPABASE_LOCAL_BASELINE_READY == 'true'
        run: |
          npx supabase@2.110.0 start
          npx supabase@2.110.0 db reset --local
          npx supabase@2.110.0 test db --local supabase/tests
      - name: Rehearse live pricing on isolated PostgreSQL 17
        run: >-
          node scripts/test-live-pricing-migrations.mjs --fixture
          --db-url postgresql://postgres:postgres@127.0.0.1:5432/stackr_live_pricing_test
      - name: Record local baseline blocker
        if: vars.SUPABASE_LOCAL_BASELINE_READY != 'true'
        run: echo "Local reset is gated until the pre-repository production schema is baselined into migrations."

  openapi-and-generated-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: |
          node scripts/deploy/patch-wrangler-do-optional-binding.mjs
          node scripts/test-wrangler-do-optional-binding-compat.mjs
          node scripts/test-attest-gateway-do-identity.mjs
          node scripts/test-write-gateway-release-config.mjs
      - run: npm run check:api-contract
      - run: npm run test:stackr-api-v1
      - run: npm test --prefix gateway

  recognition-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build pinned non-root image
        run: docker build --pull --tag stackr-recognition:${{ github.sha }} recognition-service
      - name: Inspect production image guards
        run: |
          test "$(docker image inspect stackr-recognition:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test -n "$(docker image inspect stackr-recognition:${{ github.sha }} --format '{{json .Config.Healthcheck}}')"
      - name: Exercise container health
        run: |
          docker run --detach --rm --name stackr-recognition-ci -p 18080:8080 stackr-recognition:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs stackr-recognition-ci
          exit 1

  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix gateway
      - run: node scripts/test-secret-scan-fixtures.mjs
      - run: npm run ci:secret-scan
      - name: Scan commits introduced by this change
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run ci:secret-scan -- --history-range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            npm run ci:secret-scan -- --history-range="HEAD^..HEAD"
          fi
      - name: Audit Node dependency trees
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/root-audit.json" || true
          npm audit --omit=dev --prefix backend --json > "$RUNNER_TEMP/backend-audit.json" || true
          npm audit --omit=dev --prefix gateway --json > "$RUNNER_TEMP/gateway-audit.json" || true
          node scripts/deploy/check-dependency-audit.mjs --file="$RUNNER_TEMP/root-audit.json" --max-critical=0
          node scripts/deploy/check-dependency-audit.mjs --file="$RUNNER_TEMP/backend-audit.json" --max-critical=0
          node scripts/deploy/check-dependency-audit.mjs --file="$RUNNER_TEMP/gateway-audit.json" --max-critical=0
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement recognition-service/requirements.txt

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: recognition-service/requirements-dev.txt
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: python -m pip install --requirement recognition-service/requirements-dev.txt
      - run: npm run test:stackr-api-v1
      - run: node scripts/test-quality-observability.mjs
      - run: npm test --prefix gateway
      - run: python -m pytest recognition-service/tests -q

  benchmark-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:benchmark-smoke
      - run: npm run test:pilot-dataset
      - run: npm run test:embedding-v0-guard
      - run: npm run test:reference-pack
      - run: npm run verify-model-compatibility
      - run: npm run test:card-identity-search
      - run: npm run test:local-on-device-inference
      - run: npm run test:local-quick-scan
      - run: npm run test:recognition-feedback
      - run: npm run test:reviewed-capture-manifest
      - run: npm run test:recognition-tomorrow-prep
      - run: npm run test:evidence-fusion
      - run: npm run test:deployment
      - run: npm run build:web
      - name: Scan exported mobile/web bundle for secrets
        run: node scripts/deploy/secret-scan.mjs --directory=dist
