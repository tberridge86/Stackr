name: TW official remaining 365 artwork discovery
on:
  push:
    branches: ['artwork/tw-sv4a-sv2a-20260926']
    paths: ['.github/workflows/tw-official-remaining-365-discovery.yml']
permissions:
  contents: read
concurrency:
  group: tw-official-365-readonly-20260926
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout only the pinned read-only verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0b34d75693387dc5ac697c698cd74206d48987dd
          persist-credentials: false
          sparse-checkout: scripts/audit-tw-remaining-365.py
          sparse-checkout-cone-mode: false
      - name: Prepare isolated pinned decoder and test selectors
        run: |
          python3 -m venv /tmp/tw-365-venv
          /tmp/tw-365-venv/bin/python -m pip install --disable-pip-version-check --no-deps Pillow==12.3.0
          /tmp/tw-365-venv/bin/python -m py_compile scripts/audit-tw-remaining-365.py
          /tmp/tw-365-venv/bin/python - <<'PY'
          import runpy
          m=runpy.run_path('scripts/audit-tw-remaining-365.py')
          source='''<h1 class="pageHeader cardDetail"><span class="evolveMarker">基礎</span> 走路草 </h1><span class="collectorNumber">001/190</span><div class="cardImage"><img src="https://asia.pokemon-card.com/tw/card-img/tw00009029.png"></div><a href="/tw/card-search/list/?expansionCodes=SV4a">高級擴充包</a>'''
          r=m['parse_detail'](source,'https://asia.pokemon-card.com/tw/card-search/detail/9029/')
          assert r['official_native_name']=='走路草' and r['number']=='001' and r['denominator']==190 and r['official_set_codes']==['SV4a']
          listing='''<li class="card"><a href="/tw/card-search/detail/9029/"><img class="lazy" src="" data-original="https://asia.pokemon-card.com/tw/card-img/tw00009029.png"></a></li><a href="/tw/card-search/list/?pageNo=2&amp;expansionCodes=SV4a">Next</a>'''
          links,nxt=m['parse_list'](listing,'https://asia.pokemon-card.com/tw/card-search/list/?expansionCodes=SV4a')
          assert list(links)==[9029] and len(nxt)==1 and '&expansionCodes=SV4a' in nxt[0]
          assert m['normalized_name']('莉佳的招待[支援者]')==m['normalized_name']('莉佳的招待')
          print('Exact identity and lazy-image/pagination selector tests passed.')
          PY
      - name: Recover and verify official Traditional Chinese fronts without production access
        run: /tmp/tw-365-venv/bin/python scripts/audit-tw-remaining-365.py
      - name: Preserve exact manifest and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tw-official-remaining-365-${{ github.run_id }}
          path: tw-official-365
          retention-days: 14
          if-no-files-found: error
