name: Apply guarded card-first candidate

on:
  push:
    branches: [agent/release/card-first-browse-ui]
    paths: ['.github/workflows/card-first-ui-apply.yml']

permissions:
  contents: write

concurrency:
  group: apply-card-first-candidate
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'tberridge86/Stackr' && github.ref == 'refs/heads/agent/release/card-first-browse-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and commit exact source
        run: python scripts/.apply-card-first-edits.py
      - name: Fast-forward candidate branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/agent/release/card-first-browse-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-card-first-ui.cjs
      - run: npm run test:home-release
      - run: npm run test:binder-catalogue
      - run: npm run test:personal-loading
      - name: Scoped lint
        run: >-
          npx eslint "app/(tabs)/binder.tsx" "app/(tabs)/explore.tsx" "app/(tabs)/search.tsx"
          app/_layout.tsx app/binder/new.tsx "app/set/[id].tsx"
          components/StackrBrowseControls.tsx components/PremiumUI.tsx
          components/HomeCollectorSections.tsx components/HomeCommandCenter.tsx
          features/binder/BinderDetailScreen.tsx features/home/HubScreen.tsx
          features/market/MarketTabScreen.tsx
