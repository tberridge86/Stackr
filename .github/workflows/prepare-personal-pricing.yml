name: Prepare Personal Pricing

on:
  workflow_dispatch:
    inputs:
      scope:
        required: true
        default: personal
        type: choice
        options:
          - personal
          - catalogue
      confirmation:
        required: true
        type: string
      apply_migrations:
        required: true
        default: false
        type: boolean
      rehearse_migrations:
        description: Execute the exact migration and permission checks, then roll back; cannot be combined with apply
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: stackr-production-deployment
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && ((inputs.scope == 'personal' && inputs.confirmation == 'PREPARE PERSONAL PRICING') || (inputs.scope == 'catalogue' && inputs.confirmation == 'PREPARE CATALOGUE PRICING'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STACKR_GITHUB_PRODUCTION_BACKUPS || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_BACKUP_FALLBACK_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRICING_OWNER_EMAIL: berridge14@icloud.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-prepare-personal-pricing.mjs
      - name: Prepare normalized production database URL
        run: node scripts/deploy/prepare-postgres-urls.mjs --source-only
      - name: Verify a current physical backup and create logical recovery dumps
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/personal-pricing-backup"
          node scripts/deploy/list-production-backups.mjs --output="$RUNNER_TEMP/personal-pricing-backup/physical.json"
          npx --yes supabase@2.110.0 db dump --db-url "$STACKR_SOURCE_DB_URL" --file "$RUNNER_TEMP/personal-pricing-backup/schema.sql"
          npx --yes supabase@2.110.0 db dump --db-url "$STACKR_SOURCE_DB_URL" --data-only --use-copy --file "$RUNNER_TEMP/personal-pricing-backup/data.sql"
          node scripts/deploy/verify-backup.mjs --physical="$RUNNER_TEMP/personal-pricing-backup/physical.json" --schema="$RUNNER_TEMP/personal-pricing-backup/schema.sql" --data="$RUNNER_TEMP/personal-pricing-backup/data.sql" --require-physical
      - name: Verify or apply the reviewed pricing migration scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy/prepare-personal-pricing.mjs --db-url="$STACKR_SOURCE_DB_URL" --owner-email="$PRICING_OWNER_EMAIL" --scope="${{ inputs.scope }}" --apply="${{ inputs.apply_migrations }}" --rehearse="${{ inputs.rehearse_migrations }}" | tee "$RUNNER_TEMP/personal-pricing-preparation.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.scope }}-pricing-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/personal-pricing-preparation.json
          retention-days: 90
      - name: Remove ephemeral logical backup files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/personal-pricing-backup"
