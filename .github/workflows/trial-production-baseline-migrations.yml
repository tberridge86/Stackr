name: Trial Production Baseline Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REPLAY MIGRATIONS ON RESTORE TARGET
        required: true
        type: string
      baseline_artifact_id:
        description: Private production-schema baseline artifact ID
        required: true
        type: string
      baseline_archive_sha256:
        description: SHA-256 of the downloaded baseline archive
        required: true
        type: string
      baseline_schema_sha256:
        description: SHA-256 of production-schema.sql within the baseline
        required: true
        type: string
      baseline_history_count:
        description: Number of migration-history rows in the captured baseline
        required: true
        type: string
      baseline_history_version:
        description: Latest migration version in the captured baseline
        required: true
        type: string
      baseline_history_name:
        description: Latest migration name in the captured baseline
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: stackr-production-baseline-migration-trial
  cancel-in-progress: false

jobs:
  replay:
    if: inputs.confirmation == 'REPLAY MIGRATIONS ON RESTORE TARGET'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      SUPABASE_RESTORE_DB_URL: ${{ secrets.SUPABASE_RESTORE_DB_URL }}
      SUPABASE_RESTORE_PROJECT_REF: krjttpmthxkfsbqksxci
      SUPABASE_STAGING_PROJECT_REF: lmwfhvexfcoyeuoyrlco
      SUPABASE_PRODUCTION_PROJECT_REF: oakdbbzdqwurpjnoqhmu
      BASELINE_ARTIFACT_ID: ${{ inputs.baseline_artifact_id }}
      BASELINE_ARCHIVE_SHA256: ${{ inputs.baseline_archive_sha256 }}
      BASELINE_SCHEMA_SHA256: ${{ inputs.baseline_schema_sha256 }}
      BASELINE_HISTORY_COUNT: ${{ inputs.baseline_history_count }}
      BASELINE_HISTORY_VERSION: ${{ inputs.baseline_history_version }}
      BASELINE_HISTORY_NAME: ${{ inputs.baseline_history_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate isolated restore target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_RESTORE_DB_URL"
          test "$SUPABASE_RESTORE_PROJECT_REF" != "$SUPABASE_STAGING_PROJECT_REF"
          test "$SUPABASE_RESTORE_PROJECT_REF" != "$SUPABASE_PRODUCTION_PROJECT_REF"
          case "$SUPABASE_RESTORE_DB_URL" in
            *"$SUPABASE_RESTORE_PROJECT_REF"*) ;;
            *) echo '::error::restore_database_url_project_mismatch'; exit 1 ;;
          esac
          node scripts/deploy/prepare-isolated-reconciliation-url.mjs

      - name: Install pinned dependencies
        run: npm ci

      - name: Download and verify private baseline artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stackr-baseline-trial/artifact"
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/stackr-baseline-trial/baseline.zip"
          printf '%s  %s\n' "$BASELINE_ARCHIVE_SHA256" \
            "$RUNNER_TEMP/stackr-baseline-trial/baseline.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/stackr-baseline-trial/baseline.zip" \
            -d "$RUNNER_TEMP/stackr-baseline-trial/artifact"
          node scripts/deploy/verify-production-schema-baseline.mjs \
            --directory="$RUNNER_TEMP/stackr-baseline-trial/artifact" \
            --expected-schema-sha256="$BASELINE_SCHEMA_SHA256" \
            --expected-history-count="$BASELINE_HISTORY_COUNT" \
            --expected-history-version="$BASELINE_HISTORY_VERSION" \
            --expected-history-name="$BASELINE_HISTORY_NAME"
          node scripts/deploy/secret-scan.mjs \
            --directory="$RUNNER_TEMP/stackr-baseline-trial/artifact"

      - name: Restore production schema and migration history into isolated target
        shell: bash
        env:
          POSTGRES_IMAGE: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        run: |
          set -euo pipefail
          node scripts/deploy/prepare-restore-cleanup.mjs \
            "$RUNNER_TEMP/stackr-baseline-trial/artifact/migration-history-data.sql" \
            "$RUNNER_TEMP/stackr-baseline-trial/cleanup.sql"
          docker run --rm \
            --env TARGET_DB_URL="$STACKR_RESTORE_DB_URL" \
            --volume "$RUNNER_TEMP/stackr-baseline-trial:/trial:ro" \
            "$POSTGRES_IMAGE" \
            sh -ceu 'psql --dbname "$TARGET_DB_URL" --variable ON_ERROR_STOP=1 --file /trial/cleanup.sql; psql --dbname "$TARGET_DB_URL" --single-transaction --variable ON_ERROR_STOP=1 --file /trial/artifact/production-schema.sql --file /trial/artifact/migration-history-schema.sql --file /trial/artifact/migration-history-data.sql'

      - name: Verify restored production migration history
        shell: bash
        env:
          POSTGRES_IMAGE: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        run: |
          set -euo pipefail
          case "$BASELINE_HISTORY_COUNT" in
            ''|*[!0-9]*) echo '::error::invalid_baseline_history_count'; exit 1 ;;
          esac
          restored_keys="$RUNNER_TEMP/stackr-baseline-trial/restored-baseline-migration-keys.txt"
          if [ "$BASELINE_HISTORY_COUNT" = '0' ]; then
            : > "$restored_keys"
            exit 0
          fi
          docker run --rm \
            --env TARGET_DB_URL="$STACKR_RESTORE_DB_URL" \
            "$POSTGRES_IMAGE" \
            sh -ceu 'psql --dbname "$TARGET_DB_URL" --no-align --tuples-only --command "select concat(version, chr(95), name) from supabase_migrations.schema_migrations order by version, name"' \
            > "$restored_keys"
          test "$(wc -l < "$restored_keys" | tr -d '[:space:]')" = "$BASELINE_HISTORY_COUNT"
          expected_keys="$RUNNER_TEMP/stackr-baseline-trial/expected-baseline-migration-keys.txt"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed 's/\.sql$//' \
            | LC_ALL=C sort \
            | head -n "$BASELINE_HISTORY_COUNT" \
            > "$expected_keys"
          cmp --silent "$expected_keys" "$restored_keys"
          test "$(tail -n 1 "$restored_keys")" = "${BASELINE_HISTORY_VERSION}_${BASELINE_HISTORY_NAME}"

      - name: Confirm full migration plan
        run: npx --yes supabase@2.110.0 db push --db-url "$STACKR_RESTORE_DB_URL" --include-all --dry-run

      - name: Replay repository migrations on isolated target
        run: npx --yes supabase@2.110.0 db push --db-url "$STACKR_RESTORE_DB_URL" --include-all

      - name: Record isolated migration history
        shell: bash
        env:
          POSTGRES_IMAGE: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        run: |
          set -euo pipefail
          docker run --rm \
            --env TARGET_DB_URL="$STACKR_RESTORE_DB_URL" \
            "$POSTGRES_IMAGE" \
            sh -ceu 'psql --dbname "$TARGET_DB_URL" --no-align --tuples-only --command "select count(*) from supabase_migrations.schema_migrations"' \
            > "$RUNNER_TEMP/stackr-baseline-trial/migration-count.txt"
          docker run --rm \
            --env TARGET_DB_URL="$STACKR_RESTORE_DB_URL" \
            "$POSTGRES_IMAGE" \
            sh -ceu 'psql --dbname "$TARGET_DB_URL" --no-align --tuples-only --command "select concat(version, chr(95), name) from supabase_migrations.schema_migrations order by version, name"' \
            > "$RUNNER_TEMP/stackr-baseline-trial/actual-migration-keys.txt"
          expected_migrations="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d '[:space:]')"
          actual_migrations="$(tr -d '[:space:]' < "$RUNNER_TEMP/stackr-baseline-trial/migration-count.txt")"
          test "$actual_migrations" = "$expected_migrations"
          node scripts/deploy/create-production-migration-replay-evidence.mjs \
            --actual-keys="$RUNNER_TEMP/stackr-baseline-trial/actual-migration-keys.txt" \
            --output="$RUNNER_TEMP/stackr-baseline-trial/evidence.json" \
            --production-project-ref="$SUPABASE_PRODUCTION_PROJECT_REF" \
            --staging-project-ref="$SUPABASE_STAGING_PROJECT_REF" \
            --restore-project-ref="$SUPABASE_RESTORE_PROJECT_REF" \
            --baseline-artifact-id="$BASELINE_ARTIFACT_ID" \
            --baseline-archive-sha256="$BASELINE_ARCHIVE_SHA256" \
            --baseline-schema-sha256="$BASELINE_SCHEMA_SHA256" \
            --baseline-history-count="$BASELINE_HISTORY_COUNT" \
            --baseline-history-version="$BASELINE_HISTORY_VERSION" \
            --baseline-history-name="$BASELINE_HISTORY_NAME" \
            --baseline-actual-keys="$RUNNER_TEMP/stackr-baseline-trial/restored-baseline-migration-keys.txt"

      - name: Upload non-secret migration replay evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-migration-replay-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/stackr-baseline-trial/evidence.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove baseline and connection evidence
        if: always()
        run: rm -rf "$RUNNER_TEMP/stackr-baseline-trial"

  catalogue-transfer:
    if: inputs.confirmation == 'REHEARSE STAGING CATALOGUE TRANSFER'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_RESTORE_DB_URL: ${{ secrets.SUPABASE_RESTORE_DB_URL }}
      SUPABASE_PROJECT_REF: lmwfhvexfcoyeuoyrlco
      SUPABASE_RESTORE_PROJECT_REF: krjttpmthxkfsbqksxci
      SUPABASE_PRODUCTION_PROJECT_REF: oakdbbzdqwurpjnoqhmu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate isolated transfer target
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = 'lmwfhvexfcoyeuoyrlco'
          test "$SUPABASE_RESTORE_PROJECT_REF" = 'krjttpmthxkfsbqksxci'
          test "$SUPABASE_PRODUCTION_PROJECT_REF" = 'oakdbbzdqwurpjnoqhmu'
          test "$SUPABASE_PROJECT_REF" != "$SUPABASE_RESTORE_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "$SUPABASE_PRODUCTION_PROJECT_REF"
          test "$SUPABASE_RESTORE_PROJECT_REF" != "$SUPABASE_PRODUCTION_PROJECT_REF"
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_RESTORE_DB_URL"
          case "$SUPABASE_DB_URL" in *"$SUPABASE_PROJECT_REF"*) ;; *) exit 1 ;; esac
          case "$SUPABASE_RESTORE_DB_URL" in *"$SUPABASE_RESTORE_PROJECT_REF"*) ;; *) exit 1 ;; esac

      - name: Prepare protected database URLs
        run: node scripts/deploy/prepare-postgres-urls.mjs

      - name: Install pinned dependencies
        run: npm ci

      - name: Rehearse catalogue and provenance transfer
        env:
          STACKR_TRANSFER_EVIDENCE_PATH: ${{ runner.temp }}/stackr-catalogue-transfer/evidence.json
        run: node scripts/deploy/rehearse-staging-catalogue-transfer.mjs

      - name: Upload private non-record evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-catalogue-transfer-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/stackr-catalogue-transfer/evidence.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove transfer evidence
        if: always()
        run: rm -rf "$RUNNER_TEMP/stackr-catalogue-transfer"
