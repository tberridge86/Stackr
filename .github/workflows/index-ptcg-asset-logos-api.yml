name: Index PTCG Asset Logos API

on:
  push:
    branches:
      - asset/pokemon-tc-set-logo-sheet-20260911
    paths:
      - tools/index_ptcg_asset_logos_api.py
      - .github/workflows/index-ptcg-asset-logos-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow
      - run: python tools/index_ptcg_asset_logos_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: ptcg-logo-index-api-${{ github.run_id }}
          path: artifacts/ptcg-logo-index-api/
          if-no-files-found: error
          retention-days: 7
