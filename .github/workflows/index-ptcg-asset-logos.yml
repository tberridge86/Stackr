name: Index PTCG Asset Logos

on:
  push:
    branches:
      - asset/pokemon-tc-set-logo-sheet-20260911
    paths:
      - tools/index_ptcg_asset_logos.py
      - .github/workflows/index-ptcg-asset-logos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: git clone --depth=1 https://github.com/1niceroli/ptcg-assets.git /tmp/ptcg-assets
      - run: python tools/index_ptcg_asset_logos.py
      - uses: actions/upload-artifact@v4
        with:
          name: ptcg-logo-index-${{ github.run_id }}
          path: artifacts/ptcg-logo-index/
          if-no-files-found: error
          retention-days: 7

# Trigger after workflow registration.
