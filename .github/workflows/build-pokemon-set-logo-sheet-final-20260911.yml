name: Build Final Pokemon Set Logo Sheet 20260911

on:
  push:
    branches:
      - asset/pokemon-set-logo-sheet-20260911
    paths:
      - tools/build_set_logo_sheet_final_20260911.py
      - .github/workflows/build-pokemon-set-logo-sheet-final-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow reportlab

      - name: Build final logo sheet and import bundle
        run: python tools/build_set_logo_sheet_final_20260911.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-set-logo-sheet-final-6-per-page-${{ github.run_id }}
          path: artifacts/pokemon-set-logo-sheet-20260911/
          if-no-files-found: error
          retention-days: 14
