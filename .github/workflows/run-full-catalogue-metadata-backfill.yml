name: Run StackR Full Catalogue Metadata Backfill

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      force:
        description: Re-run batches already recorded as completed
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stackr-legacy-catalogue-command-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  redirect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 48 &&
      github.actor == 'tberridge86' &&
      github.event.comment.body == '/run-stackr-full-metadata-backfill-2026-08-19')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Redirect to the immutable resumable workflow
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VALUE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run resume-full-catalogue-metadata-backfill.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field force="$FORCE_VALUE"
          gh api repos/${GITHUB_REPOSITORY}/issues/48/comments \
            --method POST \
            --field body="The legacy catalogue command was redirected to the immutable resumable workflow. It no longer shares a cancelling concurrency group with unrelated PR comments."

  status:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 48 &&
      github.actor == 'tberridge86' &&
      github.event.comment.body == '/status-stackr-full-metadata-backfill-2026-08-19'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Query the pinned staging batch ledger
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stackr-metadata-status.mjs" <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          const url = String(process.env.SUPABASE_URL || '');
          const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_SECRET_KEY || '');
          if (!url.includes('lmwfhvexfcoyeuoyrlco') || !key) throw new Error('staging_catalogue_credentials_unavailable');
          const db = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
          const { data: sources, error: sourceError } = await db.schema('ingest').from('sources').select('id,code').eq('code', 'tcgdex').limit(1);
          if (sourceError) throw sourceError;
          const sourceId = sources?.[0]?.id;
          if (!sourceId) {
            console.log(JSON.stringify({ expectedBatches: 47, observedBatches: 0, statuses: {}, byLanguage: {} }));
            process.exit(0);
          }
          const { data: runs, error } = await db.schema('ingest').from('import_runs')
            .select('run_key,status,records_requested,records_retrieved,records_inserted,records_updated,records_skipped,records_conflicted,error_message')
            .eq('source_id', sourceId)
            .ilike('run_key', '%tcgdex-796afd47e430-full-primary-2026-08-19%')
            .order('started_at', { ascending: true });
          if (error) throw error;
          const statuses = { completed: 0, running: 0, failed: 0, other: 0 };
          const totals = { requested: 0, retrieved: 0, inserted: 0, updated: 0, skipped: 0, conflicted: 0 };
          const byLanguage = {};
          const errors = [];
          for (const run of runs || []) {
            const language = String(run.run_key || '').split(':')[2] || 'unknown';
            byLanguage[language] ??= { completed: 0, running: 0, failed: 0, other: 0, recordsRetrieved: 0, conflicts: 0 };
            const state = Object.prototype.hasOwnProperty.call(statuses, run.status) ? run.status : 'other';
            statuses[state] += 1;
            byLanguage[language][state] += 1;
            byLanguage[language].recordsRetrieved += Number(run.records_retrieved || 0);
            byLanguage[language].conflicts += Number(run.records_conflicted || 0);
            for (const field of Object.keys(totals)) totals[field] += Number(run[`records_${field}`] || 0);
            if (run.error_message) errors.push(String(run.error_message).slice(0, 240));
          }
          console.log(JSON.stringify({ expectedBatches: 47, observedBatches: (runs || []).length, statuses, totals, byLanguage, recentErrors: errors.slice(-3) }));
          NODE

          status_json="$(
            npx --yes @railway/cli@5.30.1 run \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_BACKEND_SERVICE_ID" \
              --no-local \
              npx --yes --package=@supabase/supabase-js@2.105.1 node "$RUNNER_TEMP/stackr-metadata-status.mjs" \
              | tail -n 1
          )"
          body="$(STATUS_JSON="$status_json" node - <<'NODE'
          const status = JSON.parse(process.env.STATUS_JSON);
          const lanes = Object.entries(status.byLanguage || {})
            .map(([language, value]) => `- ${language}: ${value.completed || 0} completed, ${value.running || 0} running, ${value.failed || 0} failed; retrieved ${value.recordsRetrieved || 0}; conflicts ${value.conflicts || 0}`)
            .join('\n');
          console.log([
            '### StackR pinned metadata backfill status',
            `- Batches observed: **${status.observedBatches || 0} / ${status.expectedBatches || 47}**`,
            `- Completed: **${status.statuses?.completed || 0}**; running: **${status.statuses?.running || 0}**; failed: **${status.statuses?.failed || 0}**`,
            `- Records retrieved: **${status.totals?.retrieved || 0}**; conflicts: **${status.totals?.conflicted || 0}**`,
            lanes,
          ].filter(Boolean).join('\n'));
          NODE
          )"
          gh api repos/${GITHUB_REPOSITORY}/issues/48/comments \
            --method POST \
            --field body="$body"
