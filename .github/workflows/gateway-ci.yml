name: Stackr Gateway CI

on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'backend/lib/gatewayOriginAuth.js'
      - 'backend/lib/qualityObservability.js'
      - 'backend/lib/traceContext.js'
      - 'backend/routes/observability.js'
      - 'backend/server.js'
      - 'lib/stackrApiV1.ts'
      - 'lib/stackrQualityEvaluation.ts'
      - 'app/admin/quality-observability.tsx'
      - 'recognition-service/**'
      - 'supabase/migrations/20260728173530_stackr_api_gateway_controls.sql'
      - 'supabase/manual/rollback_20260728173530_stackr_api_gateway_controls.sql'
      - 'supabase/migrations/20260728182743_stackr_quality_performance_observability.sql'
      - 'supabase/manual/rollback_20260728182743_stackr_quality_performance_observability.sql'
      - 'scripts/evaluate-stackr-quality.ts'
      - 'scripts/test-stackr-quality-evaluation.ts'
      - 'scripts/test-quality-observability.mjs'
      - 'data/quality/**'
      - 'docs/stackr-api/**'
      - '.github/workflows/gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'backend/lib/gatewayOriginAuth.js'
      - 'backend/lib/qualityObservability.js'
      - 'backend/lib/traceContext.js'
      - 'backend/routes/observability.js'
      - 'backend/server.js'
      - 'lib/stackrApiV1.ts'
      - 'lib/stackrQualityEvaluation.ts'
      - 'app/admin/quality-observability.tsx'
      - 'recognition-service/**'
      - 'supabase/migrations/20260728173530_stackr_api_gateway_controls.sql'
      - 'supabase/manual/rollback_20260728173530_stackr_api_gateway_controls.sql'
      - 'supabase/migrations/20260728182743_stackr_quality_performance_observability.sql'
      - 'supabase/manual/rollback_20260728182743_stackr_quality_performance_observability.sql'
      - 'scripts/evaluate-stackr-quality.ts'
      - 'scripts/test-stackr-quality-evaluation.ts'
      - 'scripts/test-quality-observability.mjs'
      - 'data/quality/**'
      - 'docs/stackr-api/**'
      - '.github/workflows/gateway-ci.yml'

permissions:
  contents: read

concurrency:
  group: stackr-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-and-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install gateway dependencies
        run: npm ci --prefix gateway

      - name: Lint app
        run: npm run lint

      - name: Type-check app
        run: npx tsc --noEmit

      - name: Type-check backend
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Test API contracts
        run: npm run test:stackr-api-v1

      - name: Test quality release gates
        run: npx tsx scripts/test-stackr-quality-evaluation.ts

      - name: Test protected observability
        run: node scripts/test-quality-observability.mjs

      - name: Test gateway
        run: npm test --prefix gateway

      - name: Build Worker without deployment
        run: npm run build --prefix gateway

  recognition-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: recognition-service/requirements-dev.txt

      - name: Install recognition test dependencies
        run: python -m pip install --requirement recognition-service/requirements-dev.txt

      - name: Test recognition service
        run: python -m pytest recognition-service/tests -q
