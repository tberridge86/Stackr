name: Materialize Official English Set Logos

on:
  push:
    branches:
      - agent/catalogue/official-english-set-logos
    paths:
      - .github/workflows/materialize-official-english-set-logos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out specialist branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Wire the canonical resolver into runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          Path('lib/localSetArtwork.ts').write_text("""import type { ImageSourcePropType } from 'react-native';
          import {
            getEnglishSetLogoSourceForSet,
            type EnglishSetLogoLookupInput,
          } from './englishSetLogos';
          import {
            getJapaneseSetLogoSourceForSet,
            type JapaneseSetLogoLookupInput,
          } from './japaneseSetLogos';
          import { getMagazineSetCoverSourceForSet } from './magazineSetCovers';

          export type LocalSetArtworkLookupInput = EnglishSetLogoLookupInput & JapaneseSetLogoLookupInput;

          /**
           * Local presentation artwork only. It never supplies card art, product images,
           * seller photographs, or a value intended for catalogue persistence.
           *
           * Resolution order is deliberate: exact magazine issues retain their cover,
           * reviewed English set identities use the canonical bundled logo, and native
           * Japanese sets retain the existing Japanese-only fallback.
           */
          export function getLocalSetArtworkSourceForSet(
            input?: LocalSetArtworkLookupInput | null,
            fallbackLanguage?: string | null,
          ): ImageSourcePropType | null {
            return getMagazineSetCoverSourceForSet(input, fallbackLanguage)
              ?? getEnglishSetLogoSourceForSet(input, fallbackLanguage)
              ?? getJapaneseSetLogoSourceForSet(input, fallbackLanguage);
          }
          """.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          japanese = Path('lib/japaneseSetLogos.ts')
          text = japanese.read_text(encoding='utf-8')
          old = 'const AMBIGUOUS_ENGLISH_SET_LOGO_KEYS = new Set<string>(["neo1", "neo2", "neo3", "neo4", "xy2", "xy3", "xy4", "xy6", "xy7", "xy9", "xy10", "sm6", "sm7", "sm8", "sm9", "sm10", "sm11", "sm12", "sv3", "sv6", "sv7", "sv8", "sv9", "sv10"]);'
          new = 'const AMBIGUOUS_ENGLISH_SET_LOGO_KEYS = new Set<string>(["bwp", "bwpromos", "dpp", "dppromos", "smp", "smpromos", "sp", "swshpromos", "svp", "xyp", "xypromos", "neo1", "neo2", "neo3", "neo4", "xy2", "xy3", "xy4", "xy6", "xy7", "xy9", "xy10", "sm6", "sm7", "sm8", "sm9", "sm10", "sm11", "sm12", "sv3", "sv6", "sv7", "sv8", "sv9", "sv10"]);'
          if old not in text and new not in text:
              raise SystemExit('Japanese ambiguity anchor changed')
          japanese.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('scripts/test-japanese-set-logo-runtime-lookup.ts')
          text = test.read_text(encoding='utf-8')
          old_dependencies = """const japaneseLogos = compileModule('lib/japaneseSetLogos.ts', {});
          const getJapaneseSetLogoSourceForSet = japaneseLogos.getJapaneseSetLogoSourceForSet as (input: Record<string, unknown>) => string | null;
          const localArtwork = compileModule('lib/localSetArtwork.ts', {
            './japaneseSetLogos': { getJapaneseSetLogoSourceForSet },
            './magazineSetCovers': { getMagazineSetCoverSourceForSet: () => null },
          });""".replace('\n          ', '\n')
          new_dependencies = """const englishLogos = compileModule('lib/englishSetLogos.ts', {});
          const japaneseLogos = compileModule('lib/japaneseSetLogos.ts', {});
          const getEnglishSetLogoSourceForSet = englishLogos.getEnglishSetLogoSourceForSet as (input: Record<string, unknown>) => string | null;
          const getJapaneseSetLogoSourceForSet = japaneseLogos.getJapaneseSetLogoSourceForSet as (input: Record<string, unknown>) => string | null;
          const localArtwork = compileModule('lib/localSetArtwork.ts', {
            './englishSetLogos': { getEnglishSetLogoSourceForSet },
            './japaneseSetLogos': { getJapaneseSetLogoSourceForSet },
            './magazineSetCovers': { getMagazineSetCoverSourceForSet: () => null },
          });""".replace('\n          ', '\n')
          if old_dependencies in text:
              text = text.replace(old_dependencies, new_dependencies)
          elif new_dependencies not in text:
              raise SystemExit('Japanese test dependency anchor changed')

          old_assertion = """assert.equal(
            getLocalSetArtworkSourceForSet({ ...japaneseSm6, language: 'en' }),
            null,
            'The ambiguous SM6 key must not assign a Japanese logo to an English set.',
          );

          const explore""".replace('\n          ', '\n')
          new_assertion = """assert.equal(
            getLocalSetArtworkSourceForSet({ ...japaneseSm6, language: 'en' }),
            null,
            'The ambiguous SM6 key must not assign a Japanese logo to an English set.',
          );

          for (const promoCode of ['bwp', 'dpp', 'smp', 'sp', 'svp', 'xyp']) {
            assert.equal(
              getJapaneseSetLogoSourceForSet({ id: promoCode, language: 'en' }),
              null,
              `English promo identity ${promoCode} must not inherit a Japanese bundled mark.`,
            );
            assert.ok(
              getJapaneseSetLogoSourceForSet({ id: promoCode, language: 'ja' }),
              `Explicit Japanese promo identity ${promoCode} must retain its Japanese bundled mark.`,
            );
          }

          const explore""".replace('\n          ', '\n')
          if old_assertion in text:
              text = text.replace(old_assertion, new_assertion)
          elif new_assertion not in text:
              raise SystemExit('Japanese test assertion anchor changed')
          text = text.replace(
              "console.log('Japanese SM6 bundled fallback resolves on Explore/search inputs without an English-code collision.');",
              "console.log('Japanese bundled fallbacks resolve only for Japanese identities; English promo and expansion collisions are blocked.');",
          )
          test.write_text(text, encoding='utf-8')

          package = Path('package.json')
          payload = json.loads(package.read_text(encoding='utf-8'))
          scripts = payload['scripts']
          scripts['catalogue:materialize-official-english-set-logos'] = 'python scripts/materialize-official-english-set-logos.py'
          scripts['test:official-english-set-logos'] = 'python scripts/materialize-official-english-set-logos.py --check && node scripts/test-official-english-set-logo-runtime-lookup.cjs'
          integration = scripts['test:integration-repair']
          suffix = ' && npm run test:official-english-set-logos'
          if suffix not in integration:
              anchor = 'node --import tsx scripts/test-japanese-set-logo-runtime-lookup.ts'
              if anchor not in integration:
                  raise SystemExit('Integration repair script anchor changed')
              integration = integration.replace(anchor, anchor + suffix)
          scripts['test:integration-repair'] = integration
          package.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Materialize exact reviewed binaries
        run: python scripts/materialize-official-english-set-logos.py

      - name: Run bounded regression suite
        run: |
          npm run test:official-english-set-logos
          node --import ./scripts/enable-node-tooling-runtime.mjs --import tsx scripts/test-japanese-set-logo-runtime-lookup.ts
          npm run typecheck

      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "Stackr catalogue agent"
          git config user.email "tberridge86@users.noreply.github.com"
          git add \
            assets/rev2/12-english-set-logo/logos \
            lib/localSetArtwork.ts \
            lib/japaneseSetLogos.ts \
            scripts/test-japanese-set-logo-runtime-lookup.ts \
            package.json
          if git diff --cached --quiet; then
            echo "No materialized integration changes to commit"
          else
            git commit -m "Integrate canonical official English set logos"
            git push origin HEAD:agent/catalogue/official-english-set-logos
          fi
