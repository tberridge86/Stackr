name: Collection Price Backpressure

on:
  pull_request:
    paths:
      - 'lib/collectionPricingApi.ts'
      - 'scripts/test-collection-price-backpressure.mjs'
      - '.github/workflows/collection-price-backpressure.yml'
  push:
    branches: [main]
    paths:
      - 'lib/collectionPricingApi.ts'
      - 'scripts/test-collection-price-backpressure.mjs'
      - '.github/workflows/collection-price-backpressure.yml'

permissions:
  contents: read

jobs:
  bounded-collection-read-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Exercise actual collection loader with isolated dependencies
        run: node --experimental-strip-types --test scripts/test-collection-price-backpressure.mjs
